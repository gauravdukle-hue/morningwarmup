<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --border:   #1e1e2e;
    --text:     #c9cdd6;
    --dim:      #555668;
    --accent:   #5af;
    --green:    #3d9970;
    --red:      #e74c3c;
    --yellow:   #f1c40f;
    --mono:     'IBM Plex Mono', monospace;
    --sans:     'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; min-height: 100vh; }

  /* HEADER */
  .header { padding: 16px 20px 0; border-bottom: 1px solid var(--border); }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .logo { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: 0.15em; text-transform: uppercase; }
  .last-updated { font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .net-worth { font-family: var(--mono); font-size: 28px; font-weight: 300; color: #fff; letter-spacing: -0.02em; }
  .net-worth-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .net-worth-change { font-family: var(--mono); font-size: 12px; margin-top: 2px; }
  .pos { color: var(--green); } .neg { color: var(--red); }

  /* TABS */
  .tabs { display: flex; gap: 0; overflow-x: auto; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 16px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* CONTENT */
  .content { padding: 16px 20px; }
  .section { display: none; }
  .section.active { display: block; }

  /* CARDS */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
  .card-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .card-title { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .card-value { font-family: var(--mono); font-size: 13px; }
  .card-body { padding: 10px 14px; }

  /* ACCOUNT ROW */
  .account-row { padding: 8px 0; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; gap: 4px; }
  .account-row:last-child { border-bottom: none; }
  .account-name { font-size: 12px; font-weight: 500; color: var(--text); }
  .account-sub { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 2px; }
  .account-total { font-family: var(--mono); font-size: 13px; text-align: right; }
  .account-pl { font-family: var(--mono); font-size: 10px; text-align: right; margin-top: 2px; }

  /* STOCK ROW */
  .stock-row { padding: 7px 0; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 60px 1fr auto; gap: 4px; align-items: center; }
  .stock-row:last-child { border-bottom: none; }
  .stock-ticker { font-family: var(--mono); font-size: 12px; font-weight: 500; color: #fff; }
  .stock-detail { font-size: 10px; color: var(--dim); }
  .stock-right { text-align: right; }
  .stock-price { font-family: var(--mono); font-size: 12px; }
  .stock-pl { font-family: var(--mono); font-size: 10px; margin-top: 2px; }

  /* SIGNAL ROW */
  .signal { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .signal:last-child { border-bottom: none; }
  .signal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .signal-ticker { font-family: var(--mono); font-size: 13px; font-weight: 500; color: #fff; }
  .signal-score { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 2px; }
  .signal-score.strong { background: rgba(90,170,255,0.15); color: var(--accent); }
  .signal-score.good   { background: rgba(241,196,15,0.12); color: var(--yellow); }
  .signal-type { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
  .signal-type.entry   { color: var(--green); }
  .signal-type.exit    { color: var(--red); }
  .signal-type.shakeout{ color: var(--dim); }
  .signal-detail { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .signal-stops { font-family: var(--mono); font-size: 10px; color: var(--accent); margin-top: 4px; }

  /* JOURNAL */
  .journal-entry { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .journal-entry:last-child { border-bottom: none; }
  .journal-meta { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-bottom: 4px; display: flex; gap: 10px; }
  .journal-text { font-size: 12px; line-height: 1.5; color: var(--text); }
  .journal-tags { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-family: var(--mono); font-size: 9px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 2px; color: var(--dim); text-transform: uppercase; }

  /* DAILY STATS */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }
  .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); margin-bottom: 4px; }
  .stat-value { font-family: var(--mono); font-size: 20px; font-weight: 300; color: #fff; }
  .stat-bar { height: 2px; background: var(--border); border-radius: 1px; margin-top: 6px; overflow: hidden; }
  .stat-fill { height: 100%; background: var(--accent); border-radius: 1px; transition: width 0.5s; }

  /* TRADES */
  .trade-row { padding: 8px 14px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 50px 70px 1fr auto; gap: 6px; align-items: center; }
  .trade-row:last-child { border-bottom: none; }
  .trade-dir { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.05em; }
  .trade-dir.buy  { color: var(--green); }
  .trade-dir.sell { color: var(--red); }
  .trade-ticker { font-family: var(--mono); font-size: 12px; font-weight: 500; color: #fff; }
  .trade-detail { font-size: 10px; color: var(--dim); }
  .trade-total { font-family: var(--mono); font-size: 11px; text-align: right; }
  .trade-status { font-family: var(--mono); font-size: 9px; text-align: right; color: var(--dim); margin-top: 2px; }

  /* STAT ROW */
  .stat-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-key { font-size: 11px; color: var(--dim); }
  .stat-val { font-family: var(--mono); font-size: 11px; }

  .empty { font-size: 11px; color: var(--dim); padding: 16px 0; text-align: center; }
  .tf-badge { font-family: var(--mono); font-size: 9px; padding: 2px 5px; background: var(--border); border-radius: 2px; color: var(--dim); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">Trading Dashboard</div>
    <div class="last-updated" id="last-updated">—</div>
  </div>
  <div class="net-worth-label">Net Worth</div>
  <div class="net-worth" id="net-worth">$0</div>
  <div class="net-worth-change" id="net-worth-change"></div>
  <br>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('holdings')">Holdings</div>
  <div class="tab" onclick="showTab('signals')">Signals</div>
  <div class="tab" onclick="showTab('journal')">Journal</div>
  <div class="tab" onclick="showTab('trades')">Trades</div>
</div>

<div class="content">

  <!-- HOLDINGS -->
  <div id="tab-holdings" class="section active">
    <div id="accounts-container"></div>
    <div class="card">
      <div class="card-header"><span class="card-title">Open Positions</span></div>
      <div class="card-body" id="positions-container"></div>
    </div>
  </div>

  <!-- SIGNALS -->
  <div id="tab-signals" class="section">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Entries</span>
        <span class="card-value" id="signal-tf"></span>
      </div>
      <div id="entries-container"></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Exits / Caution</span></div>
      <div id="exits-container"></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">All Scored Tickers</span></div>
      <div class="card-body" id="scored-container"></div>
    </div>
  </div>

  <!-- JOURNAL -->
  <div id="tab-journal" class="section">
    <div class="stat-grid" id="daily-stats"></div>
    <div class="card">
      <div class="card-header"><span class="card-title">Today's Entries</span></div>
      <div id="journal-container"></div>
    </div>
  </div>

  <!-- TRADES -->
  <div id="tab-trades" class="section">
    <div class="card">
      <div class="card-header"><span class="card-title">Recent Trades</span></div>
      <div id="trades-container"></div>
    </div>
  </div>

</div>

// ─────────────────────────────────────────
// TABS
// ─────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ─────────────────────────────────────────
// FORMAT HELPERS
// ─────────────────────────────────────────
const fmt  = n => '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
const fmtp = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const plClass = n => n >= 0 ? 'pos' : 'neg';

// ─────────────────────────────────────────
// RENDER HOLDINGS
// ─────────────────────────────────────────
function renderHoldings() {
  document.getElementById('net-worth').textContent = fmt(DATA.net_worth);
  document.getElementById('last-updated').textContent = DATA.generated;

  const plEl = document.getElementById('net-worth-change');
  if (DATA.total_pl !== 0) {
    plEl.innerHTML = `<span class="${plClass(DATA.total_pl)}">${DATA.total_pl >= 0 ? '+' : ''}${fmt(DATA.total_pl)} unrealised</span>`;
  }

  const acEl = document.getElementById('accounts-container');
  acEl.innerHTML = '';
  if (!DATA.accounts.length) { acEl.innerHTML = '<div class="empty">No account data</div>'; return; }

  DATA.accounts.forEach(a => {
    const card = document.createElement('div');
    card.className = 'card';
    const pl = a.stock_total - a.stock_cost;
    const plPct = a.stock_cost > 0 ? (pl / a.stock_cost * 100) : 0;
    card.innerHTML = `
      <div class="card-header">
        <span class="card-title">${a.name}</span>
        <span class="card-value">${fmt(a.total)}</span>
      </div>
      <div class="card-body">
        <div class="stat-row"><span class="stat-key">Cash</span><span class="stat-val">${fmt(a.cash)}</span></div>
        <div class="stat-row"><span class="stat-key">Invested</span><span class="stat-val">${fmt(a.stock_total)}</span></div>
        ${pl !== 0 ? `<div class="stat-row"><span class="stat-key">Unrealised P&L</span><span class="stat-val ${plClass(pl)}">${pl >= 0 ? '+' : ''}${fmt(pl)} (${fmtp(plPct)})</span></div>` : ''}
      </div>`;
    acEl.appendChild(card);
  });

  const posEl = document.getElementById('positions-container');
  if (!DATA.positions.length) { posEl.innerHTML = '<div class="empty">No open positions</div>'; return; }
  posEl.innerHTML = DATA.positions.map(p => {
    const pl = (p.price - p.avg) * p.shares;
    const plPct = (p.price - p.avg) / p.avg * 100;
    return `<div class="stock-row">
      <div class="stock-ticker">${p.symbol}</div>
      <div><div class="stock-detail">${p.shares} sh @ $${p.avg.toFixed(2)}</div><div class="stock-detail">${p.account}</div></div>
      <div class="stock-right">
        <div class="stock-price">$${p.price.toFixed(2)}</div>
        <div class="stock-pl ${plClass(pl)}">${pl >= 0 ? '+' : ''}${fmt(pl)} (${fmtp(plPct)})</div>
      </div>
    </div>`;
  }).join('');
}

// ─────────────────────────────────────────
// RENDER SIGNALS
// ─────────────────────────────────────────
function renderSignals() {
  document.getElementById('signal-tf').textContent = DATA.signals.tf;

  const renderSignalList = (items, containerId) => {
    const el = document.getElementById(containerId);
    if (!items.length) { el.innerHTML = '<div class="empty">No signals</div>'; return; }
    el.innerHTML = items.map(s => {
      const isEntry   = ['ENTRY','REENTRY'].includes(s.type);
      const isExit    = ['TIER2_EXIT','TIER1_EXIT'].includes(s.type);
      const typeClass = isEntry ? 'entry' : isExit ? 'exit' : 'shakeout';
      const typeLabel = s.type.replace('_', ' ');
      const scoreClass = s.score >= 70 ? 'strong' : 'good';
      const stops = (s.stop && s.target) ? `<div class="signal-stops">stop $${s.stop} → target $${s.target}</div>` : '';
      return `<div class="signal">
        <div class="signal-header">
          <span class="signal-ticker">${s.ticker} <span class="tf-badge">${s.tf}</span></span>
          <span class="signal-score ${scoreClass}">${s.score}</span>
        </div>
        <div class="signal-type ${typeClass}">${typeLabel}</div>
        <div class="signal-detail">${s.detail}</div>
        ${stops}
      </div>`;
    }).join('');
  };

  renderSignalList(DATA.signals.entries, 'entries-container');
  renderSignalList(DATA.signals.exits,   'exits-container');

  const sc = document.getElementById('scored-container');
  if (!DATA.signals.scored.length) { sc.innerHTML = '<div class="empty">No data</div>'; return; }
  sc.innerHTML = DATA.signals.scored.map(r =>
    `<div class="stat-row">
      <span class="stat-key">${r.ticker} <span style="color:var(--dim);font-size:10px">${r.structure}</span></span>
      <span class="stat-val">${r.score} <span style="color:var(--dim);font-size:10px">$${r.price}</span></span>
    </div>`
  ).join('');
}

// ─────────────────────────────────────────
// RENDER JOURNAL
// ─────────────────────────────────────────
function renderJournal() {
  const s = DATA.journal.stats;
  const statsEl = document.getElementById('daily-stats');
  const metrics = [
    { label: 'Sleep', value: s.sleep || '—', max: 10 },
    { label: 'Mind',  value: s.mind  || '—', max: 10 },
    { label: 'Body',  value: s.physical || '—', max: 10 },
  ];
  statsEl.innerHTML = metrics.map(m => `
    <div class="stat-box">
      <div class="stat-label">${m.label}</div>
      <div class="stat-value">${m.value}</div>
      <div class="stat-bar"><div class="stat-fill" style="width:${m.value !== '—' ? (m.value/m.max*100) : 0}%"></div></div>
    </div>`).join('');

  if (s.goal) {
    statsEl.innerHTML += `<div class="card" style="grid-column:1/-1;padding:10px 12px;font-size:11px;color:var(--dim)">
      Goal: <span style="color:var(--text)">${s.goal}</span>
    </div>`;
  }

  const jEl = document.getElementById('journal-container');
  if (!DATA.journal.today.length) { jEl.innerHTML = '<div class="empty">No entries today</div>'; return; }
  jEl.innerHTML = DATA.journal.today.map(e => `
    <div class="journal-entry">
      <div class="journal-meta">
        <span>${e.time}</span>
        <span>${e.sentiment || ''}</span>
      </div>
      <div class="journal-text">${e.entry}</div>
      ${e.tags ? `<div class="journal-tags">${e.tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('')}</div>` : ''}
    </div>`).join('');
}

// ─────────────────────────────────────────
// RENDER TRADES
// ─────────────────────────────────────────
function renderTrades() {
  const el = document.getElementById('trades-container');
  if (!DATA.trades.length) { el.innerHTML = '<div class="empty">No trades yet</div>'; return; }
  el.innerHTML = DATA.trades.map(t => `
    <div class="trade-row">
      <div class="trade-dir ${t.direction.toLowerCase()}">${t.direction}</div>
      <div class="trade-ticker">${t.symbol}</div>
      <div><div class="trade-detail">${t.shares} @ $${t.price} · ${t.account}</div><div class="trade-detail">${t.date}</div></div>
      <div><div class="trade-total">${fmt(t.total)}</div><div class="trade-status">${t.status}</div></div>
    </div>`).join('');
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
renderHoldings();
renderSignals();
renderJournal();
renderTrades();
</script>
</body>
</html>

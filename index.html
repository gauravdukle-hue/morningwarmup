<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#fff;font-family:'Geist',sans-serif;font-size:14px}
.mono{font-family:'Geist Mono',monospace}
.muted{color:#888}
.pos{color:#4ade80}.neg{color:#f87171}

/* TOPBAR */
.topbar{background:#111;border-bottom:1px solid #222;padding:14px 16px;position:sticky;top:0;z-index:10}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end}
.brand{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:6px}
.nw{font-family:'Geist Mono',monospace;font-size:28px;font-weight:300;letter-spacing:-.02em;line-height:1}
.nw-pl{font-family:'Geist Mono',monospace;font-size:12px;margin-top:4px}
.updated{font-size:10px;color:#444;text-align:right}

/* TABS */
.tabs{display:flex;background:#111;border-bottom:1px solid #222;overflow-x:auto;scrollbar-width:none;position:sticky;top:73px;z-index:9}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 16px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#555;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0;transition:color .15s}
.tab.on{color:#fff;border-bottom-color:#fff}

/* CONTENT */
.content{padding:14px 14px 60px}
.section{display:none}.section.on{display:block}

/* CARDS */
.card{background:#161616;border:1px solid #222;border-radius:10px;margin-bottom:12px;overflow:hidden}
.card-hd{padding:11px 14px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.card-lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#555}
.card-body{padding:12px 14px}

/* SECTION LABEL */
.slbl{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#444;margin:16px 0 8px}
.slbl:first-child{margin-top:0}

/* STAT GRID */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#161616;border:1px solid #222;border-radius:10px;padding:12px 14px}
.stat-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#555;margin-bottom:4px}
.stat-val{font-family:'Geist Mono',monospace;font-size:22px;font-weight:300}
.stat-sub{font-family:'Geist Mono',monospace;font-size:11px;color:#666;margin-top:2px}

/* ROWS */
.row{padding:10px 14px;border-bottom:1px solid #1e1e1e;display:flex;justify-content:space-between;align-items:center}
.row:last-child{border-bottom:none}
.rl{flex:1;min-width:0}
.rr{text-align:right;flex-shrink:0;margin-left:12px}
.rt{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:11px;color:#666;margin-top:2px}
.rv{font-family:'Geist Mono',monospace;font-size:14px}
.rv2{font-family:'Geist Mono',monospace;font-size:11px;margin-top:2px;color:#666}

/* BADGES */
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.bg{background:#0d2b1a;color:#4ade80}
.br{background:#2b0d0d;color:#f87171}
.bb{background:#1a1a2b;color:#a78bfa}
.by{background:#2b1f0d;color:#fbbf24}
.bx{background:#1e1e1e;color:#888}

/* SIGNALS */
.sig{background:#161616;border:1px solid #222;border-radius:10px;margin-bottom:8px;overflow:hidden}
.sig.entry{border-left:3px solid #4ade80}
.sig.exit{border-left:3px solid #f87171}
.sig.hold{border-left:3px solid #444}
.sig-hd{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.sig-tk{font-family:'Geist Mono',monospace;font-size:16px;font-weight:500}
.sig-sc{font-family:'Geist Mono',monospace;font-size:11px;color:#666}
.sig-bar{height:3px;background:#222;margin:0 14px 8px}
.sig-fill{height:100%;border-radius:2px}
.sig-dt{padding:0 14px 10px;font-size:12px;color:#888;line-height:1.55}
.sig-st{font-family:'Geist Mono',monospace;font-size:11px;padding:8px 14px;border-top:1px solid #1e1e1e;display:flex;gap:16px}
.sig-st span{color:#555}.sig-st b{color:#fff;font-weight:500}

/* METER */
.meter{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid #1a1a1a}
.meter:last-child{border-bottom:none}
.mtk{font-family:'Geist Mono',monospace;font-size:12px;width:50px;flex-shrink:0}
.mbar{flex:1;height:6px;background:#222;border-radius:3px;overflow:hidden}
.mfill{height:100%;border-radius:3px}
.msc{font-family:'Geist Mono',monospace;font-size:11px;color:#555;width:28px;text-align:right;flex-shrink:0}
.mpx{font-family:'Geist Mono',monospace;font-size:11px;color:#444;width:58px;text-align:right;flex-shrink:0}

/* JOURNAL */
.je{padding:10px 14px;border-bottom:1px solid #1e1e1e}
.je:last-child{border-bottom:none}
.jm{display:flex;gap:8px;align-items:center;margin-bottom:5px;font-family:'Geist Mono',monospace;font-size:10px;color:#555}
.jt{font-size:13px;line-height:1.55}

/* PIE */
.pie-wrap{padding:16px 14px;display:flex;align-items:center;gap:16px}
.pie-canvas{position:relative;width:130px;height:130px;flex-shrink:0}
.pie-legend{flex:1;min-width:0}
.pie-leg-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.pie-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.pie-name{font-size:11px;color:#888;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie-pct{font-family:'Geist Mono',monospace;font-size:11px}

/* EMPTY */
.empty{padding:24px;text-align:center;font-size:12px;color:#444}

/* CHART */
.ch-wrap{position:relative;padding:14px;height:220px}
</style>
</head>

<div class="topbar">
  <div class="brand">Trading Dashboard</div>
  <div class="topbar-row">
    <div>
      <div class="nw mono" id="nw">—</div>
      <div class="nw-pl" id="nwpl"></div>
    </div>
    <div class="updated" id="upd">—</div>
  </div>
</div>

<div class="tabs">
  <div class="tab on" data-tab="holdings">Holdings</div>
  <div class="tab" data-tab="signals">Signals</div>
  <div class="tab" data-tab="watchlist">Watchlist</div>
  <div class="tab" data-tab="journal">Journal</div>
  <div class="tab" data-tab="trades">Trades</div>
</div>

<div class="content">

  <div id="tab-holdings" class="section on">
    <div class="stats" id="h-stats"></div>

    <div class="slbl">Portfolio Sunburst</div>
    <div class="card">
      <div style="padding:10px 14px;border-bottom:1px solid #1e1e1e;display:flex;justify-content:space-between;align-items:center">
        <span class="card-lbl">Allocation &amp; P&amp;L by Account</span>
        <span id="pie-total" class="mono" style="font-size:11px;color:#555"></span>
      </div>
      <div style="padding:10px 4px 4px">
        <svg id="sunburst-svg" style="width:100%;display:block" role="img" aria-label="Sunburst chart of portfolio by account group and individual account">Portfolio by account.</svg>
      </div>
      <div id="sunburst-legend" style="padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid #1e1e1e"></div>
    </div>

    <div class="slbl">Accounts — sorted by size</div>
    <div class="card" id="acct-list"></div>
    <div class="slbl">Open Positions — sorted by P&amp;L</div>
    <div class="card" id="pos-list"></div>
  </div>

  <div id="tab-signals" class="section">
    <div class="slbl" id="sig-tf"></div>
    <div class="slbl">Entries</div>
    <div id="entries"></div>
    <div class="slbl" style="margin-top:20px">Exits &amp; Caution</div>
    <div id="exits"></div>
  </div>

  <div id="tab-watchlist" class="section">
    <div class="slbl">EMA Scores</div>
    <div class="card" id="scored"></div>
    <div class="slbl">Score Chart</div>
    <div class="card"><div class="ch-wrap"><canvas id="scoreChart" role="img" aria-label="EMA scores by ticker">EMA scores by ticker.</canvas></div></div>
  </div>

  <div id="tab-journal" class="section">
    <div class="stats" id="j-stats"></div>
    <div id="goal-box"></div>
    <div class="slbl">Today's thoughts</div>
    <div class="card" id="j-list"></div>
  </div>

  <div id="tab-trades" class="section">
    <div class="slbl">Recent Trades</div>
    <div class="card" id="t-list"></div>
  </div>

</div>

    if(name.includes('Roth'))   return 'Roth';
    if(name.includes('Intel'))  return 'Intel ET';
    if(name.includes('Robinhood')) return 'Robinhood';
    if(name.includes('Crypto')) return 'Crypto';
    if(name.includes('Health')) return 'Health';
    return 'Individual';

  // Short name helper

  const W     = svgEl.parentElement.offsetWidth || 340;
  const H     = Math.max(300, W * 0.85);
  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svgEl.setAttribute('height', H);
  const cx = W/2, cy = H/2;
  const R1=65, R2=125, R3=W/2-12;

  
  const svg = d3.select(svgEl).append('g').attr('transform',`translate(${cx},${cy})`);

  // Build hierarchy data
  const hdata = {name:'root', children: Object.entries(groups).map(([g,accs])=>({
    name:g, col:GRP_COL[g]||'#888',
    children: accs.map(a=>({
      name:sn(a.name), fullName:a.name,
      value:a.total, pl:a.stock_total-a.stock_cost,
      stock:a.stock_total, cash:a.cash
    }))
  }))};

  const root = d3.hierarchy(hdata).sum(d=>d.value||0);
  d3.partition().size([2*Math.PI,1])(root);

  const arcFn = (ir,or) => d3.arc()
    .startAngle(d=>d.x0).endAngle(d=>d.x1)
    .innerRadius(ir).outerRadius(or)
    .padAngle(0.018).padRadius((ir+or)/2);

  const arc1 = arcFn(R1,R2);
  const arc2 = arcFn(R2+3,R3);

  // Inner ring — groups
  const grpNodes = root.children || [];
  svg.selectAll('.garc').data(grpNodes).join('path').attr('class','garc')
    .attr('d',arc1).attr('fill',d=>d.data.col+'cc')
    .attr('stroke','#0d0d0d').attr('stroke-width',1.5);

  // Inner labels
  svg.selectAll('.glbl').data(grpNodes).join('text').attr('class','glbl')
    .attr('transform',d=>{
      const mid=(d.x0+d.x1)/2, r=(R1+R2)/2;
      const x=Math.sin(mid)*r, y=-Math.cos(mid)*r;
      const rot=(mid*180/Math.PI)-90 + (mid>Math.PI?180:0);
      return `translate(${x},${y})rotate(${rot})`;
    })
    .attr('text-anchor','middle').attr('dominant-baseline','middle')
    .attr('fill','#fff').attr('font-size',9).attr('font-weight',600)
    .attr('font-family',"'Geist',sans-serif")
    .text(d=>(d.x1-d.x0)>0.12?d.data.name:(d.x1-d.x0)>0.05?d.data.name.slice(0,4):'');

  // Outer ring — accounts
  const accNodes = grpNodes.flatMap(g=>g.children||[]);
  svg.selectAll('.aarc').data(accNodes).join('path').attr('class','aarc')
    .attr('d',arc2)
    .attr('fill',d=>{
      const pl=d.data.pl||0;
      if(Math.abs(pl)<100) return d.parent.data.col+'66';
      return pl>0?'#4ade8099':'#f8717188';
    })
    .attr('stroke','#0d0d0d').attr('stroke-width',1);

  // Outer labels — account names
  svg.selectAll('.albl').data(accNodes).join('text').attr('class','albl')
    .attr('transform',d=>{
      const mid=(d.x0+d.x1)/2, r=(R2+3+R3)/2;
      const x=Math.sin(mid)*r, y=-Math.cos(mid)*r;
      const rot=(mid*180/Math.PI)-90 + (mid>Math.PI?180:0);
      return `translate(${x},${y})rotate(${rot})`;
    })
    .attr('text-anchor','middle').attr('dominant-baseline','middle')
    .attr('fill','#fff').attr('font-size',8.5).attr('font-weight',500)
    .attr('font-family',"'Geist',sans-serif")
    .text(d=>(d.x1-d.x0)>0.1?d.data.name:(d.x1-d.x0)>0.04?d.data.name.slice(0,5):'');

  // Center
  svg.append('text').attr('text-anchor','middle').attr('fill','#fff')
    .attr('font-family',"'Geist Mono',monospace").attr('font-size',16).attr('font-weight',300)
    .attr('dy',-10).text(fm(tot));
  svg.append('text').attr('text-anchor','middle')
    .attr('fill',totalPL>=0?'#4ade80':'#f87171')
    .attr('font-family',"'Geist Mono',monospace").attr('font-size',10)
    .attr('dy',6).text((totalPL>=0?'+':'')+fm(totalPL));
  svg.append('text').attr('text-anchor','middle').attr('fill','#444')
    .attr('font-family',"'Geist',sans-serif").attr('font-size',8).attr('dy',18).text('NET WORTH');

  // Legend
  $('sunburst-legend').innerHTML = Object.entries(GRP_COL)
    .filter(([g])=>groups[g])
    .map(([g,col])=>`<span style="font-size:10px;padding:2px 8px;border-radius:4px;background:${col}22;color:${col};font-weight:600">${g}</span>`)
    .join('');

  // ACCOUNT LIST — sorted by total
  $('acct-list').innerHTML = accts.map(a=>{
    const pl    = a.stock_total - a.stock_cost;
    const plPct = a.stock_cost>0 ? pl/a.stock_cost*100 : 0;
    const plStr = a.stock_cost>0 ? ` <span class="${pc(pl)}">${fd(pl)} (${fp(plPct)})</span>` : '';
    return `<div class="row"><div class="rl"><div class="rt">${a.name}</div><div class="rs">Cash ${fm(a.cash)} · Stocks ${fm(a.stock_total)}${plStr}</div></div><div class="rr"><div class="rv">${fm(a.total)}</div></div></div>`;
  }).join('');

  // POSITIONS — sorted by P&L descending
  const sortedPos = DATA.positions.slice().sort((a,b)=>((b.price-b.avg)*b.shares)-((a.price-a.avg)*a.shares));
  $('pos-list').innerHTML = sortedPos.length
    ? sortedPos.map(p=>{
        const pl  = (p.price-p.avg)*p.shares;
        const plP = (p.price-p.avg)/p.avg*100;
        return `<div class="row"><div class="rl"><div class="rt">${p.symbol} <span style="font-size:11px;color:#555;font-weight:400">${p.account}</span></div><div class="rs">${p.shares.toLocaleString()} sh · avg $${p.avg.toFixed(2)} → $${p.price.toFixed(2)}</div></div><div class="rr"><div class="rv ${pc(pl)}">${fd(pl)}</div><div class="rv2 ${pc(pl)}">${fp(plP)}</div></div></div>`;
      }).join('')
    : '<div class="empty">No open positions</div>';
})();

// ── SIGNALS ──
(function(){
  $('sig-tf').textContent = 'Timeframe: ' + DATA.signals.tf;

  const renderList = (items, el) => {
    if (!items.length) { $(el).innerHTML='<div class="card"><div class="empty">No signals</div></div>'; return; }
    $(el).innerHTML = items.map(s=>{
      const isE   = ['ENTRY','REENTRY'].includes(s.type);
      const isX   = ['TIER2_EXIT','TIER1_EXIT'].includes(s.type);
      const cls   = isE?'entry':isX?'exit':'hold';
      const lbl   = isE?(s.type==='REENTRY'?'Re-entry':'Entry'):isX?'Exit':s.type.replace(/_/g,' ').toLowerCase();
      const bcls  = isE?'bg':isX?'br':'bx';
      const fcol  = s.score>=70?'#4ade80':s.score>=60?'#fbbf24':'#f87171';
      const stops = (s.stop&&s.target)?`<div class="sig-st"><span>Stop</span> <b>$${s.stop}</b> <span>Target</span> <b>$${s.target}</b></div>`:'';
      return `<div class="sig ${cls}">
        <div class="sig-hd"><span><span class="sig-tk">${s.ticker}</span> &nbsp;<span class="badge ${bcls}">${lbl}</span></span><span class="sig-sc">${s.score}</span></div>
        <div class="sig-bar"><div class="sig-fill" style="width:${s.score}%;background:${fcol}"></div></div>
        <div class="sig-dt">${s.detail}</div>${stops}</div>`;
    }).join('');
  };
  renderList(DATA.signals.entries,'entries');
  renderList(DATA.signals.exits,  'exits');
})();

// ── WATCHLIST ──
(function(){
  const items = DATA.signals.scored;
  if (!items.length){$('scored').innerHTML='<div class="empty">Run /ema to populate</div>';return;}
  $('scored').innerHTML = items.map(r=>{
    const col = r.score>=70?'#4ade80':r.score>=60?'#fbbf24':'#f87171';
    return `<div class="meter"><div class="mtk">${r.ticker}</div><div class="mbar"><div class="mfill" style="width:${r.score}%;background:${col}"></div></div><div class="msc">${r.score}</div><div class="mpx">$${Number(r.price).toFixed(0)}</div></div>`;
  }).join('');

  new Chart($('scoreChart'),{
    type:'bar',
    data:{labels:items.map(r=>r.ticker),datasets:[{data:items.map(r=>r.score),backgroundColor:items.map(r=>r.score>=70?'#4ade80':r.score>=60?'#fbbf24':'#f87171'),borderRadius:3,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#555',font:{size:10},maxRotation:45},grid:{display:false}},
              y:{min:0,max:100,ticks:{color:'#555',font:{size:10}},grid:{color:'#1e1e1e'}}}}
  });
})();

// ── JOURNAL ──
(function(){
  const s = DATA.journal.stats;
  $('j-stats').innerHTML =
    `<div class="stat"><div class="stat-lbl">Sleep</div><div class="stat-val">${s.sleep||'—'}<span style="font-size:14px;color:#444">/10</span></div><div class="stat-sub">Mind ${s.mind||'—'}/10 · Body ${s.physical||'—'}/10</div></div>` +
    `<div class="stat"><div class="stat-lbl">P&L Today</div><div class="stat-val ${s.pnl&&s.pnl[0]==='-'?'neg':'pos'}">${s.pnl||'—'}</div></div>`;

  if (s.goal) $('goal-box').innerHTML = `<div class="card" style="margin-bottom:12px"><div class="card-body"><span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#555;font-weight:600">Goal &nbsp;</span><span style="font-size:13px">${s.goal}</span></div></div>`;

  $('j-list').innerHTML = DATA.journal.today.length
    ? DATA.journal.today.map(e=>`<div class="je"><div class="jm"><span>${e.time}</span>${e.sentiment?`<span class="badge ${e.sentiment==='positive'?'bg':e.sentiment==='negative'?'br':'bx'}">${e.sentiment}</span>`:''}</div><div class="jt">${e.entry}</div></div>`).join('')
    : '<div class="empty">No entries today</div>';
})();

// ── TRADES ──
$('t-list').innerHTML = DATA.trades.length
  ? DATA.trades.map(t=>`<div class="row"><div class="rl"><div class="rt"><span class="badge ${t.direction==='BUY'?'bg':'br'}">${t.direction}</span> &nbsp;${t.symbol}</div><div class="rs">${t.shares} sh @ $${t.price} · ${t.account} · ${t.date}</div></div><div class="rr"><div class="rv">${fm(t.total)}</div><div class="rv2">${t.status}</div></div></div>`).join('')
  : '<div class="empty">No trades yet</div>';
</script>
</body>
</html>

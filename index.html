<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#fff;font-family:sans-serif;font-size:14px}
.g{color:#4ade80}.r{color:#f87171}.m{color:#888}
.top{background:#111;border-bottom:1px solid #222;padding:14px 16px;position:sticky;top:0;z-index:10}
.brand{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#444;margin-bottom:6px}
.nw-row{display:flex;justify-content:space-between;align-items:flex-end}
.nw{font-family:monospace;font-size:28px;font-weight:300}
.nw-pl{font-family:monospace;font-size:12px;margin-top:3px}
.ts{font-size:10px;color:#444;text-align:right}
.tabs{display:flex;background:#111;border-bottom:1px solid #222;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 16px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#555;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.tab.on{color:#fff;border-bottom-color:#4ade80}
.pg{padding:14px 14px 60px}
.sec{display:none}.sec.on{display:block}
.card{background:#161616;border:1px solid #222;border-radius:10px;margin-bottom:12px;overflow:hidden}
.ch{padding:11px 14px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.cl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#444}
.sl{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#333;margin:16px 0 8px}
.sl:first-child{margin-top:0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:#161616;border:1px solid #222;border-radius:10px;padding:12px 14px}
.stl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#444;margin-bottom:4px}
.stv{font-family:monospace;font-size:20px;font-weight:300}
.sts{font-family:monospace;font-size:11px;color:#555;margin-top:2px}
.row{padding:10px 14px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center}
.row:last-child{border-bottom:none}
.rl{flex:1;min-width:0}.rr{text-align:right;flex-shrink:0;margin-left:10px}
.rt{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:11px;color:#555;margin-top:2px}
.rv{font-family:monospace;font-size:14px}
.rv2{font-family:monospace;font-size:11px;margin-top:2px;color:#555}
.bdg{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;text-transform:uppercase}
.bg{background:#0d2b1a;color:#4ade80}.br{background:#2b0d0d;color:#f87171}.bx{background:#1e1e1e;color:#666}
.sig{background:#161616;border:1px solid #222;border-radius:10px;margin-bottom:8px;overflow:hidden}
.se{border-left:3px solid #4ade80}.sx{border-left:3px solid #f87171}.sh{border-left:3px solid #333}
.shd{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.stk{font-family:monospace;font-size:16px;font-weight:500}
.sbar{height:3px;background:#1e1e1e;margin:0 14px 8px}
.sfl{height:100%;border-radius:2px}
.sdt{padding:0 14px 10px;font-size:12px;color:#666;line-height:1.55}
.sst{font-family:monospace;font-size:11px;padding:7px 14px;border-top:1px solid #1a1a1a;display:flex;gap:14px}
.sst span{color:#444}.sst b{color:#ddd;font-weight:500}
.mt{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid #111}
.mt:last-child{border-bottom:none}
.mtk{font-family:monospace;font-size:11px;width:48px;flex-shrink:0}
.mb{flex:1;height:5px;background:#1e1e1e;border-radius:3px;overflow:hidden}
.mf{height:100%;border-radius:3px}
.ms{font-family:monospace;font-size:10px;color:#444;width:24px;text-align:right;flex-shrink:0}
.mp{font-family:monospace;font-size:10px;color:#333;width:56px;text-align:right;flex-shrink:0}
.je{padding:10px 14px;border-bottom:1px solid #1a1a1a}
.je:last-child{border-bottom:none}
.jm{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.jt{font-size:13px;color:#ccc;line-height:1.5}
.jtm{font-family:monospace;font-size:10px;color:#444}
.empty{padding:20px;text-align:center;font-size:12px;color:#333}
</style>
</head>

<div class="top">
  <div class="brand">Trading Dashboard</div>
  <div class="nw-row">
    <div><div class="nw" id="nw">-</div><div class="nw-pl" id="nwpl"></div></div>
    <div class="ts" id="ts">-</div>
  </div>
</div>
<div class="tabs">
  <div class="tab on" data-t="holdings">Holdings</div>
  <div class="tab" data-t="signals">Signals</div>
  <div class="tab" data-t="watchlist">Watchlist</div>
  <div class="tab" data-t="journal">Journal</div>
  <div class="tab" data-t="trades">Trades</div>
</div>
<div class="pg">
  <div id="t-holdings" class="sec on">
    <div class="sg" id="h-sg"></div>
    <div class="sl">Portfolio breakdown</div>
    <div class="card">
      <div class="ch">
        <span class="cl">Ring 1=Account+Value  &nbsp; Ring 2=Holdings P&L</span>
        <span id="sb-tot" style="font-family:monospace;font-size:11px;color:#555"></span>
      </div>
      <canvas id="sb" style="display:block;width:100%"></canvas>
      <div id="sb-key" style="padding:8px 14px;display:flex;flex-wrap:wrap;gap:5px;border-top:1px solid #1a1a1a"></div>
    </div>
    <div class="sl">Cumulative Holdings</div>
    <div class="card" id="cum-list"></div>
  </div>
  <div id="t-signals" class="sec">
    <div class="sl" id="sig-tf"></div>
    <div class="sl">Entries</div><div id="entries"></div>
    <div class="sl" style="margin-top:18px">Exits</div><div id="exits"></div>
  </div>
  <div id="t-watchlist" class="sec">
    <div class="sl">EMA scores</div>
    <div class="card" id="wl-list"></div>
    <div class="sl">Chart</div>
    <div class="card"><div style="padding:14px;position:relative;height:200px"><canvas id="sc"></canvas></div></div>
  </div>
  <div id="t-journal" class="sec">
    <div class="sg" id="j-sg"></div>
    <div id="goal-box"></div>
    <div class="sl">Today</div><div class="card" id="j-list"></div>
  </div>
  <div id="t-trades" class="sec">
    <div class="sl">Recent trades</div><div class="card" id="t-list"></div>
  </div>
</div>

var $ = function(id){ return document.getElementById(id); };
var fm = function(n){ return '$'+Math.abs(Math.round(n)).toLocaleString(); };
var fd = function(n){ return (n>=0?'+':'-')+fm(n); };
var fp = function(n){ return (n>=0?'+':'')+n.toFixed(1)+'%'; };
var pc = function(n){ return n>=0?'g':'r'; };

document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    document.querySelectorAll('.sec').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on');
    document.getElementById('t-'+t.dataset.t).classList.add('on');
  };
});

$('nwpl').innerHTML = '<span class="'+pc(DATA.total_pl)+'">'+fd(DATA.total_pl)+' unrealised</span>';

// ── SUNBURST - pure canvas, zero Chart.js ────────────────────────
(function(){
  var accts = DATA.accounts.filter(function(a){return a.total>0;})
                            .sort(function(a,b){return b.total-a.total;});
  var tot   = accts.reduce(function(s,a){return s+a.total;},0);
  var cash  = accts.reduce(function(s,a){return s+a.cash;},0);
  var inv   = accts.reduce(function(s,a){return s+a.stock_total;},0);
  var tpl   = accts.reduce(function(s,a){return s+(a.stock_total-a.stock_cost);},0);

  $('h-sg').innerHTML =
    '<div class="st"><div class="stl">Invested</div><div class="stv">'+fm(inv)+'</div>'+
    '<div class="sts '+pc(tpl)+'">'+fd(tpl)+' P&L</div></div>'+
    '<div class="st"><div class="stl">Cash</div><div class="stv">'+fm(cash)+'</div>'+
    '<div class="sts m">'+accts.length+' accounts</div></div>';

  $('sb-tot').textContent = fm(tot);

  var COLS=['#60a5fa','#4ade80','#fbbf24','#f87171','#a78bfa','#fb923c','#34d399','#e879f9','#38bdf8','#818cf8'];

  var pba={};
  DATA.positions.forEach(function(p){
    if(!pba[p.account]) pba[p.account]=[];
    pba[p.account].push(p);
  });

  var canvas = $('sb');
  var W = canvas.parentElement.clientWidth || 360;
  var H = W*0.25;
  canvas.width  = W;
  canvas.height = H;
  canvas.style.height = H+'px';
  var ctx = canvas.getContext('2d');
  var cx=W/2, cy=H/2;

  // Ring radii
  var hole = H*0.12;
  var r1   = H*0.24;
  var r2   = H*0.35;
  var r3   = H*0.44;
  var r4   = H*0.49;
  var pad  = 0.012; // gap between slices in radians

  function hex2rgb(hex,a){
    var r=parseInt(hex.slice(1,3),16);
    var g=parseInt(hex.slice(3,5),16);
    var b=parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  function drawSlice(ri,ro,sa,ea,fill){
    if(ea-sa<pad*2) return;
    var s=sa+pad/2, e=ea-pad/2;
    ctx.beginPath();
    ctx.arc(cx,cy,ro,s,e);
    ctx.arc(cx,cy,ri,e,s,true);
    ctx.closePath();
    ctx.fillStyle=fill;
    ctx.fill();
  }

  function drawLabel(ri,ro,sa,ea,line1,line2,col){
    var span=ea-sa;
    if(span<0.08) return;
    var mid=sa+span/2;
    var r=(ri+ro)/2;
    var lx=cx+r*Math.cos(mid);
    var ly=cy+r*Math.sin(mid);
    var fs=Math.max(7,Math.min(12,span*(ri+ro)*0.09));
    ctx.save();
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillStyle=col||'#fff';
    if(line2&&span>0.14){
      ctx.font='600 '+fs+'px "IBM Plex Sans",sans-serif';
      ctx.fillText(line1,lx,ly-fs*0.65);
      ctx.font='400 '+(fs-1)+'px "IBM Plex Mono",monospace';
      ctx.fillStyle='#ccc';
      ctx.fillText(line2,lx,ly+fs*0.65);
    } else {
      ctx.font='600 '+fs+'px "IBM Plex Sans",sans-serif';
      ctx.fillText(line1,lx,ly);
    }
    ctx.restore();
  }

  // Fill background
  ctx.fillStyle='#161616';
  ctx.fillRect(0,0,W,H);

  // Center label
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff';
  ctx.font='300 12px "IBM Plex Mono",monospace';
  ctx.fillText(fm(tot),cx,cy-10);
  ctx.fillStyle=tpl>=0?'#4ade80':'#f87171';
  ctx.font='400 8px "IBM Plex Mono",monospace';
  ctx.fillText(fd(tpl),cx,cy+4);
  ctx.fillStyle='#444';
  ctx.font='400 8px "IBM Plex Sans",sans-serif';
  ctx.fillText('NET WORTH',cx,cy+15);

  var TWO_PI=2*Math.PI;
  var startAngle=-Math.PI/2; // start at top

  accts.forEach(function(a,i){
    var col=COLS[i%COLS.length];
    var acctAngle=TWO_PI*(a.total/tot);
    var endAngle=startAngle+acctAngle;

    // SHORT name for labels
    var sn=a.name
      .replace('G Fidelity ','G ')
      .replace('R Fidelity ','R ')
      .replace('Robinhood','RH')
      .replace('Etrade','ET')
      .replace('Intel ','')
      .trim();

    // RING 1 - account name
    drawSlice(hole,r1,startAngle,endAngle,col);
    drawLabel(hole,r1,startAngle,endAngle,sn,fm(a.total),null);

    // Build holdings for this account: cash + stocks sorted by value desc
    var pos=(pba[a.name]||[])
      .map(function(p){
        return {sym:p.symbol, mv:Math.round(p.shares*p.price), pl:Math.round((p.price-p.avg)*p.shares)};
      })
      .sort(function(x,y){return y.mv-x.mv;});

    var holdings=[];
    if(a.cash>0) holdings.push({lbl:'Cash',val:a.cash,isCash:true,pl:0});
    pos.forEach(function(p){holdings.push({lbl:p.sym,val:p.mv,isCash:false,pl:p.pl});});
    holdings.sort(function(x,y){return y.val-x.val;});

    // Fix rounding so holdings sum to account total
    if(holdings.length){
      var hsum=holdings.reduce(function(s,h){return s+h.val;},0);
      holdings[0].val+=(a.total-hsum);
    }

    var hStart=startAngle;
    holdings.forEach(function(h){
      var hAngle=acctAngle*(h.val/a.total);
      var hEnd=hStart+hAngle;

      // RING 2 - account value breakdown
      var r2col=h.isCash?'#2a2a2a':hex2rgb(col,0.55);
      drawSlice(r1,r2,hStart,hEnd,r2col);
      drawLabel(r1,r2,hStart,hEnd,h.lbl,fm(h.val),null);

      // RING 3 - holdings detail
      var r3col=h.isCash?'#1e1e1e':hex2rgb(col,0.4);
      drawSlice(r2,r3,hStart,hEnd,r3col);
      drawLabel(r2,r3,hStart,hEnd,h.lbl,fm(h.val),null);

      // RING 4 - P&L (outermost)
      if(!h.isCash){
        var plCol=h.pl>=0?'rgba(74,222,128,0.82)':'rgba(248,113,113,0.82)';
        var plLbl=(h.pl>=0?'+':'')+fm(Math.abs(h.pl));
        drawSlice(r3,r4,hStart,hEnd,plCol);
        drawLabel(r3,r4,hStart,hEnd,plLbl,'',h.pl>=0?'#fff':'#fff');
      } else {
        drawSlice(r3,r4,hStart,hEnd,'rgba(10,10,10,0.5)');
      }

      hStart=hEnd;
    });

    startAngle=endAngle;
  });

  // Cumulative holdings across all accounts
  var cumMap = {};
  DATA.positions.forEach(function(p){
    if(!cumMap[p.symbol]) cumMap[p.symbol] = {shares:0, cost:0, mv:0};
    cumMap[p.symbol].shares += p.shares;
    cumMap[p.symbol].cost   += p.shares * p.avg;
    cumMap[p.symbol].mv     += p.shares * p.price;
  });

  var cumList = Object.keys(cumMap).map(function(sym){
    var c = cumMap[sym];
    var avgPrice = c.cost / c.shares;
    var pl = c.mv - c.cost;
    return {sym:sym, shares:c.shares, avg:avgPrice, invested:c.cost, mv:c.mv, pl:pl};
  }).sort(function(a,b){ return b.mv-a.mv; });

  if(cumList.length){
    $('cum-list').innerHTML =
      '<div class="row" style="border-bottom:1px solid #222">' +
        '<div class="rl"><div style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#444">Symbol</div></div>' +
        '<div style="font-family:monospace;font-size:10px;color:#444;text-align:right;width:70px">Shares</div>' +
        '<div style="font-family:monospace;font-size:10px;color:#444;text-align:right;width:70px">Avg</div>' +
        '<div style="font-family:monospace;font-size:10px;color:#444;text-align:right;width:80px">Invested</div>' +
        '<div style="font-family:monospace;font-size:10px;color:#444;text-align:right;width:80px">P&L</div>' +
      '</div>' +
      cumList.map(function(c){
        var plPct = (c.pl / c.cost * 100);
        return '<div class="row">' +
          '<div class="rl"><div class="rt" style="font-weight:600">' + c.sym + '</div>' +
          '<div class="rs">' + c.shares.toLocaleString() + ' sh &middot; avg $' + c.avg.toFixed(2) + '</div></div>' +
          '<div style="font-family:monospace;font-size:12px;text-align:right;width:70px">' + Math.round(c.shares).toLocaleString() + '</div>' +
          '<div style="font-family:monospace;font-size:12px;text-align:right;width:70px">$' + c.avg.toFixed(2) + '</div>' +
          '<div style="font-family:monospace;font-size:12px;text-align:right;width:80px">' + fm(c.invested) + '</div>' +
          '<div style="font-family:monospace;font-size:12px;text-align:right;width:80px;color:' + (c.pl>=0?'#4ade80':'#f87171') + '">' +
            (c.pl>=0?'+':'-') + fm(c.pl) + '<br><span style="font-size:10px">' + (plPct>=0?'+':'') + plPct.toFixed(1) + '%</span></div>' +
        '</div>';
      }).join('');
  } else {
    $('cum-list').innerHTML = '<div class="empty">No positions</div>';
  }

  // Legend
  $('sb-key').innerHTML=
    accts.map(function(a,i){
      var c=COLS[i%COLS.length];
      var sn=a.name.replace('G Fidelity ','G ').replace('R Fidelity ','R ').replace('Intel ','').replace('Etrade','ET').replace('Robinhood','RH').trim();
      return '<span style="font-size:9px;padding:2px 7px;border-radius:3px;background:'+c+'22;color:'+c+';font-weight:600">'+sn+'</span>';
    }).join('')+
    '<span style="font-size:9px;padding:2px 7px;border-radius:3px;background:#4ade8022;color:#4ade80;font-weight:600">Profit</span>'+
    '<span style="font-size:9px;padding:2px 7px;border-radius:3px;background:#f8717122;color:#f87171;font-weight:600">Loss</span>';


})();

// ── SIGNALS ───────────────────────────────────────────────────────
(function(){
  $('sig-tf').textContent='Timeframe: '+DATA.signals.tf;
  var rend=function(items,el){
    if(!items.length){$(el).innerHTML='<div class="card"><div class="empty">No signals</div></div>';return;}
    $(el).innerHTML=items.map(function(s){
      var isE=s.type==='ENTRY'||s.type==='REENTRY';
      var isX=s.type==='TIER2_EXIT'||s.type==='TIER1_EXIT';
      var cls=isE?'se':isX?'sx':'sh';
      var lbl=isE?(s.type==='REENTRY'?'Re-entry':'Entry'):isX?'Exit':'Caution';
      var bc=isE?'bg':isX?'br':'bx';
      var fc=s.score>=70?'#4ade80':s.score>=60?'#fbbf24':'#f87171';
      var st=(s.stop&&s.target)?'<div class="sst"><span>Stop</span> <b>$'+s.stop+'</b> <span>Target</span> <b>$'+s.target+'</b></div>':'';
      return '<div class="sig '+cls+'"><div class="shd"><span><span class="stk">'+s.ticker+'</span> &nbsp;<span class="bdg '+bc+'">'+lbl+'</span></span><span style="font-family:monospace;font-size:11px;color:#555">'+s.score+'</span></div>'+
             '<div class="sbar"><div class="sfl" style="width:'+s.score+'%;background:'+fc+'"></div></div>'+
             '<div class="sdt">'+s.detail+'</div>'+st+'</div>';
    }).join('');
  };
  rend(DATA.signals.entries,'entries');
  rend(DATA.signals.exits,'exits');
})();

// ── WATCHLIST ─────────────────────────────────────────────────────
(function(){
  var items=DATA.signals.scored;
  if(!items.length){$('wl-list').innerHTML='<div class="empty">Run /ema to populate</div>';return;}
  $('wl-list').innerHTML=items.map(function(r){
    var c=r.score>=70?'#4ade80':r.score>=60?'#fbbf24':'#f87171';
    return '<div class="mt"><div class="mtk">'+r.ticker+'</div>'+
           '<div class="mb"><div class="mf" style="width:'+r.score+'%;background:'+c+'"></div></div>'+
           '<div class="ms">'+r.score+'</div><div class="mp">$'+Number(r.price).toFixed(0)+'</div></div>';
  }).join('');
  new Chart($('sc'),{type:'bar',
    data:{labels:items.map(function(r){return r.ticker;}),
          datasets:[{data:items.map(function(r){return r.score;}),
            backgroundColor:items.map(function(r){return r.score>=70?'#4ade80':r.score>=60?'#fbbf24':'#f87171';}),
            borderRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#555',font:{size:10}},grid:{display:false}},
              y:{min:0,max:100,ticks:{color:'#555',font:{size:10}},grid:{color:'#1a1a1a'}}}}
  });
})();

// ── JOURNAL ───────────────────────────────────────────────────────
(function(){
  var s=DATA.journal.stats;
  $('j-sg').innerHTML=
    '<div class="st"><div class="stl">Sleep &middot; Mind &middot; Body</div>'+
    '<div class="stv">'+(s.sleep||'?')+' &middot; '+(s.mind||'?')+' &middot; '+(s.physical||'?')+'</div>'+
    '<div class="sts m">out of 10</div></div>'+
    '<div class="st"><div class="stl">P&L Today</div>'+
    '<div class="stv '+(s.pnl&&s.pnl[0]==='-'?'r':'g')+'">'+(s.pnl||'-')+'</div></div>';
  if(s.goal)$('goal-box').innerHTML='<div class="card" style="margin-bottom:12px"><div style="padding:12px 14px">'+
    '<span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#444;font-weight:600">Goal &nbsp;</span>'+
    '<span style="font-size:13px;color:#ccc">'+s.goal+'</span></div></div>';
  $('j-list').innerHTML=DATA.journal.today.length?DATA.journal.today.map(function(e){
    var sc=e.sentiment==='positive'?'bg':e.sentiment==='negative'?'br':'bx';
    return '<div class="je"><div class="jm"><span class="jtm">'+e.time+'</span>'+
           (e.sentiment?'<span class="bdg '+sc+'">'+e.sentiment+'</span>':'')+
           '</div><div class="jt">'+e.entry+'</div></div>';
  }).join(''):'<div class="empty">No entries today</div>';
})();

// ── TRADES ────────────────────────────────────────────────────────
$('t-list').innerHTML=DATA.trades.length?DATA.trades.map(function(t){
  return '<div class="row"><div class="rl">'+
    '<div class="rt"><span class="bdg '+(t.direction==='BUY'?'bg':'br')+'">'+t.direction+'</span> &nbsp;'+t.symbol+'</div>'+
    '<div class="rs">'+t.shares+' sh @ $'+t.price+' &middot; '+t.account+' &middot; '+t.date+'</div></div>'+
    '<div class="rr"><div class="rv">'+fm(t.total)+'</div><div class="rv2 m">'+t.status+'</div></div></div>';
}).join(''):'<div class="empty">No trades</div>';
</script>
</body>

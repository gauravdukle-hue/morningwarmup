<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Trading Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d0d0d;
    --card:    #161616;
    --border:  #2a2a2a;
    --text:    #ffffff;
    --muted:   #aaaaaa;
    --faint:   #555555;
    --green:   #4ade80;
    --green-bg:#0d2b1a;
    --red:     #f87171;
    --red-bg:  #2b0d0d;
    --blue:    #60a5fa;
    --blue-bg: #0d1a2b;
    --gold:    #fbbf24;
    --gold-bg: #2b200d;
    --mono:    'Geist Mono', monospace;
    --sans:    'Geist', sans-serif;
    --radius:  10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; }

  /* TOP BAR */
  .topbar { background: #111111; color: #ffffff; border-bottom: 1px solid #2a2a2a; padding: 14px 16px; position: sticky; top: 0; z-index: 100; }
  .topbar-inner { display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.5; margin-bottom: 6px; }
  .net-worth { font-family: var(--mono); font-size: 30px; font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
  .net-pl { font-family: var(--mono); font-size: 12px; margin-top: 4px; }
  .net-pl.pos { color: #4ade80; }
  .net-pl.neg { color: #f87171; }
  .updated { font-size: 10px; opacity: 0.4; text-align: right; margin-top: 4px; }

  /* TABS */
  .tabs { display: flex; background: #111111; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 80px; z-index: 99; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 12px 18px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; flex-shrink: 0; }
  .tab.active { color: #ffffff; border-bottom-color: #ffffff; }

  /* LAYOUT */
  .content { padding: 14px 14px 40px; }
  .section { display: none; }
  .section.active { display: block; }

  /* CARDS */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .card-hd { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .card-label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .card-body { padding: 12px 14px; }

  /* SUMMARY STRIPS */
  .summary-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: #1a1a1a; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .stat-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .stat-val { font-family: var(--mono); font-size: 20px; font-weight: 400; }
  .stat-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ROW */
  .row { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .row:last-child { border-bottom: none; }
  .row-left { flex: 1; min-width: 0; }
  .row-right { text-align: right; flex-shrink: 0; margin-left: 10px; }
  .row-title { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .row-val { font-family: var(--mono); font-size: 14px; }
  .row-val2 { font-family: var(--mono); font-size: 11px; margin-top: 2px; }

  /* BADGES */
  .badge { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; }
  .badge-green { background: #0d2b1a; color: #4ade80; }
  .badge-red   { background: #2b0d0d; color: #f87171; }
  .badge-blue  { background: #0d1a2b; color: #60a5fa; }
  .badge-gold  { background: #2b200d; color: #fbbf24; }
  .badge-gray  { background: #222222; color: #aaaaaa; }

  /* P&L COLORS */
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  /* SIGNAL CARDS */
  .signal-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
  .signal-hd { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
  .signal-ticker { font-family: var(--mono); font-size: 16px; font-weight: 500; }
  .signal-score { font-family: var(--mono); font-size: 12px; }
  .signal-detail { padding: 0 14px 10px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .signal-stops { font-family: var(--mono); font-size: 11px; padding: 7px 14px; border-top: 1px solid var(--border); display: flex; gap: 14px; }
  .signal-stops span { color: var(--muted); }
  .signal-stops b { color: var(--text); font-weight: 500; }
  .signal-entry { border-left: 3px solid var(--green); }
  .signal-exit  { border-left: 3px solid var(--red); }
  .signal-hold  { border-left: 3px solid var(--faint); }

  /* SCORE BAR */
  .score-bar { height: 3px; background: var(--border); border-radius: 2px; margin: 6px 14px 10px; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .fill-strong { background: var(--green); }
  .fill-good   { background: var(--gold); }
  .fill-weak   { background: var(--red); }

  /* SECTION HEADER */
  .section-hd { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
  .section-hd:first-child { margin-top: 0; }

  /* JOURNAL */
  .journal-entry { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .journal-entry:last-child { border-bottom: none; }
  .journal-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; }
  .journal-time { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .journal-text { font-size: 13px; line-height: 1.55; }

  /* SCORE METER */
  .meter-row { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-bottom: 1px solid var(--border); }
  .meter-row:last-child { border-bottom: none; }
  .meter-ticker { font-family: var(--mono); font-size: 12px; font-weight: 500; width: 50px; flex-shrink: 0; }
  .meter-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .meter-bar { height: 100%; border-radius: 3px; }
  .meter-score { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 28px; text-align: right; flex-shrink: 0; }
  .meter-price { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 60px; text-align: right; flex-shrink: 0; }

  /* EMPTY */
  .empty { padding: 20px; text-align: center; font-size: 12px; color: var(--faint); }

  /* CHART WRAP */
  .chart-wrap { padding: 12px 14px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Trading Dashboard</div>
  <div class="topbar-inner">
    <div>
      <div class="net-worth" id="net-worth">—</div>
      <div class="net-pl" id="net-pl"></div>
    </div>
    <div class="updated" id="updated">—</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="holdings">Holdings</div>
  <div class="tab" data-tab="signals">Signals</div>
  <div class="tab" data-tab="scored">Watchlist</div>
  <div class="tab" data-tab="journal">Journal</div>
  <div class="tab" data-tab="trades">Trades</div>
</div>

<div class="content">

  <!-- HOLDINGS -->
  <div id="tab-holdings" class="section active">
    <div id="holdings-summary" class="summary-strip"></div>
    <div class="section-hd">By Account</div>
    <div class="card" id="accounts-list"></div>
    <div class="section-hd">Open Positions</div>
    <div class="card" id="positions-list"></div>
  </div>

  <!-- SIGNALS -->
  <div id="tab-signals" class="section">
    <div id="signal-tf-label" class="section-hd"></div>
    <div class="section-hd">Entries</div>
    <div id="entries-list"></div>
    <div class="section-hd" style="margin-top:20px">Exits &amp; Caution</div>
    <div id="exits-list"></div>
  </div>

  <!-- WATCHLIST SCORES -->
  <div id="tab-scored" class="section">
    <div class="section-hd">Scored Tickers</div>
    <div class="card" id="scored-list"></div>
    <div style="margin-top:14px">
      <div class="section-hd">Score Distribution</div>
      <div class="card chart-wrap">
        <div style="position:relative;height:180px">
          <canvas id="scoreChart" role="img" aria-label="Bar chart of EMA scores by ticker"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- JOURNAL -->
  <div id="tab-journal" class="section">
    <div class="summary-strip" id="checkin-stats"></div>
    <div id="goal-card"></div>
    <div class="section-hd">Today's thoughts</div>
    <div class="card" id="journal-list"></div>
  </div>

  <!-- TRADES -->
  <div id="tab-trades" class="section">
    <div class="section-hd">Recent Trades</div>
    <div class="card" id="trades-list"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DATA = {
  "generated": "—",
  "net_worth": 0,
  "total_pl": 0,
  "accounts": [],
  "positions": [],
  "signals": {"tf":"4hr","entries":[],"exits":[],"scored":[]},
  "journal": {"today":[],"stats":{}},
  "trades": []
};

const $ = id => document.getElementById(id);
const fmt  = n => '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
const fmtd = n => (n >= 0 ? '+' : '') + fmt(n);
const pct  = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const pc   = n => n >= 0 ? 'pos' : 'neg';

// TABS
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $('tab-' + t.dataset.tab).classList.add('active');
  };
});

// TOPBAR
function renderTopbar() {
  $('net-worth').textContent = fmt(DATA.net_worth);
  $('updated').textContent = DATA.generated;
  if (DATA.total_pl) {
    const el = $('net-pl');
    el.textContent = fmtd(DATA.total_pl) + ' unrealised';
    el.className = 'net-pl ' + pc(DATA.total_pl);
  }
}

// HOLDINGS
function renderHoldings() {
  const invested = DATA.accounts.reduce((s, a) => s + a.stock_total, 0);
  const cash     = DATA.accounts.reduce((s, a) => s + a.cash, 0);
  $('holdings-summary').innerHTML = `
    <div class="stat"><div class="stat-label">Invested</div><div class="stat-val">${fmt(invested)}</div><div class="stat-sub ${pc(DATA.total_pl)}">${fmtd(DATA.total_pl)} P&L</div></div>
    <div class="stat"><div class="stat-label">Cash</div><div class="stat-val">${fmt(cash)}</div><div class="stat-sub">${DATA.accounts.length} accounts</div></div>`;

  const acList = $('accounts-list');
  if (!DATA.accounts.length) { acList.innerHTML = '<div class="empty">No account data</div>'; return; }
  acList.innerHTML = DATA.accounts.filter(a => a.total > 0).map(a => {
    const pl = a.stock_total - a.stock_cost;
    const plPct = a.stock_cost > 0 ? pl / a.stock_cost * 100 : 0;
    const plStr = pl !== 0 ? ` <span class="${pc(pl)}">${fmtd(pl)} (${pct(plPct)})</span>` : '';
    return `<div class="row">
      <div class="row-left"><div class="row-title">${a.name}</div><div class="row-sub">Cash ${fmt(a.cash)} · Invested ${fmt(a.stock_total)}${plStr}</div></div>
      <div class="row-right"><div class="row-val">${fmt(a.total)}</div></div>
    </div>`;
  }).join('');

  const posList = $('positions-list');
  if (!DATA.positions.length) { posList.innerHTML = '<div class="empty">No open positions</div>'; return; }
  posList.innerHTML = DATA.positions.map(p => {
    const pl    = (p.price - p.avg) * p.shares;
    const plP   = (p.price - p.avg) / p.avg * 100;
    return `<div class="row">
      <div class="row-left">
        <div class="row-title">${p.symbol} <span style="font-size:11px;color:var(--muted);font-weight:400">${p.account}</span></div>
        <div class="row-sub">${p.shares.toLocaleString()} sh · avg $${p.avg.toFixed(2)} · now $${p.price.toFixed(2)}</div>
      </div>
      <div class="row-right">
        <div class="row-val ${pc(pl)}">${fmtd(pl)}</div>
        <div class="row-val2 ${pc(pl)}">${pct(plP)}</div>
      </div>
    </div>`;
  }).join('');
}

// SIGNALS
function renderSignals() {
  $('signal-tf-label').textContent = `Timeframe: ${DATA.signals.tf}`;

  const renderSig = (items, container) => {
    if (!items.length) { $(container).innerHTML = '<div class="card"><div class="empty">No signals this scan</div></div>'; return; }
    $(container).innerHTML = items.map(s => {
      const isEntry   = ['ENTRY','REENTRY'].includes(s.type);
      const isExit    = ['TIER2_EXIT','TIER1_EXIT'].includes(s.type);
      const cls       = isEntry ? 'signal-entry' : isExit ? 'signal-exit' : 'signal-hold';
      const typeLabel = isEntry ? (s.type === 'REENTRY' ? 'Re-entry' : 'Entry') : isExit ? 'Exit' : s.type.replace(/_/g,' ').toLowerCase();
      const badgeCls  = isEntry ? 'badge-green' : isExit ? 'badge-red' : 'badge-gray';
      const quality   = s.score >= 70 ? 'strong' : 'good';
      const fillCls   = s.score >= 70 ? 'fill-strong' : 'fill-good';
      const stops = (s.stop && s.target) ? `<div class="signal-stops"><span>Stop</span> <b>$${s.stop}</b> <span>Target</span> <b>$${s.target}</b></div>` : '';
      return `<div class="signal-card ${cls}">
        <div class="signal-hd">
          <div><span class="signal-ticker">${s.ticker}</span> <span class="badge ${badgeCls}">${typeLabel}</span></div>
          <div class="signal-score">${s.score} · ${quality}</div>
        </div>
        <div class="score-bar"><div class="score-fill ${fillCls}" style="width:${s.score}%"></div></div>
        <div class="signal-detail">${s.detail}</div>
        ${stops}
      </div>`;
    }).join('');
  };
  renderSig(DATA.signals.entries, 'entries-list');
  renderSig(DATA.signals.exits,   'exits-list');
}

// WATCHLIST SCORES
function renderScored() {
  const items = DATA.signals.scored;
  if (!items.length) { $('scored-list').innerHTML = '<div class="empty">Run /ema to populate</div>'; return; }
  $('scored-list').innerHTML = items.map(r => {
    const fillCls = r.score >= 70 ? 'fill-strong' : r.score >= 60 ? 'fill-good' : 'fill-weak';
    return `<div class="meter-row">
      <div class="meter-ticker">${r.ticker}</div>
      <div class="meter-bar-wrap"><div class="meter-bar ${fillCls}" style="width:${r.score}%"></div></div>
      <div class="meter-score">${r.score}</div>
      <div class="meter-price">$${Number(r.price).toFixed(0)}</div>
    </div>`;
  }).join('');

  // Chart
  const labels = items.map(r => r.ticker);
  const scores = items.map(r => r.score);
  const colors = scores.map(s => s >= 70 ? '#1a7a4a' : s >= 60 ? '#8a6914' : '#c0392b');
  new Chart($('scoreChart'), {
    type: 'bar',
    data: { labels, datasets: [{ data: scores, backgroundColor: colors, borderRadius: 3, borderSkipped: false }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { font: { size: 10 }, color: '#aaaaaa', maxRotation: 45 }, grid: { display: false } },
        y: { min: 0, max: 100, ticks: { font: { size: 10 }, color: '#aaaaaa' }, grid: { color: '#2a2a2a' } }
      }
    }
  });
}

// JOURNAL
function renderJournal() {
  const s = DATA.journal.stats;
  const metrics = [
    { label: 'Sleep',  val: s.sleep    || '—', sub: '/10' },
    { label: 'Mind',   val: s.mind     || '—', sub: '/10' },
    { label: 'Body',   val: s.physical || '—', sub: '/10' },
    { label: 'P&L',    val: s.pnl      || '—', sub: '' },
  ];
  $('checkin-stats').innerHTML = metrics.map(m =>
    `<div class="stat"><div class="stat-label">${m.label}</div><div class="stat-val">${m.val}<span style="font-size:13px;color:var(--muted)">${m.sub}</span></div></div>`
  ).join('');

  if (s.goal) {
    $('goal-card').innerHTML = `<div class="card" style="margin-bottom:12px"><div class="card-body" style="font-size:13px"><span style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600">Today's goal &nbsp;</span>${s.goal}</div></div>`;
  }

  const jList = $('journal-list');
  if (!DATA.journal.today.length) { jList.innerHTML = '<div class="empty">No entries today</div>'; return; }
  jList.innerHTML = DATA.journal.today.map(e => {
    const sent = e.sentiment ? `<span class="badge badge-${e.sentiment === 'positive' ? 'green' : e.sentiment === 'negative' ? 'red' : 'gray'}">${e.sentiment}</span>` : '';
    return `<div class="journal-entry">
      <div class="journal-meta"><span class="journal-time">${e.time}</span>${sent}</div>
      <div class="journal-text">${e.entry}</div>
    </div>`;
  }).join('');
}

// TRADES
function renderTrades() {
  const tList = $('trades-list');
  if (!DATA.trades.length) { tList.innerHTML = '<div class="empty">No trades yet</div>'; return; }
  tList.innerHTML = DATA.trades.map(t => {
    const isBuy   = t.direction.toUpperCase() === 'BUY';
    const badgeCls = isBuy ? 'badge-green' : 'badge-red';
    const total    = Number(t.total || 0);
    return `<div class="row">
      <div class="row-left">
        <div class="row-title"><span class="badge ${badgeCls}">${t.direction}</span> ${t.symbol}</div>
        <div class="row-sub">${t.shares} sh @ $${t.price} · ${t.account} · ${t.date}</div>
      </div>
      <div class="row-right">
        <div class="row-val">${fmt(total)}</div>
        <div class="row-val2" style="color:var(--muted)">${t.status}</div>
      </div>
    </div>`;
  }).join('');
}

renderTopbar();
renderHoldings();
renderSignals();
renderScored();
renderJournal();
renderTrades();
</script>
</body>
</html>

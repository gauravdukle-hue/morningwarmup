<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:14px}
.g{color:#4ade80}.r{color:#f87171}.m{color:#888}
.top{background:#111;border-bottom:1px solid #222;padding:14px 16px;position:sticky;top:0;z-index:10}
.brand{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#444;margin-bottom:6px}
.nw-row{display:flex;justify-content:space-between;align-items:flex-end}
.nw{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:300}
.nw-pl{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:3px}
.ts{font-size:10px;color:#444}
.tabs{display:flex;background:#111;border-bottom:1px solid #222;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 16px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#555;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.tab.on{color:#fff;border-bottom-color:#4ade80}
.pg{padding:14px 14px 60px}
.sec{display:none}.sec.on{display:block}
.card{background:#161616;border:1px solid #222;border-radius:10px;margin-bottom:12px;overflow:hidden}
.ch{padding:11px 14px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.cl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#444}
.sl{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#555;margin:16px 0 8px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:#161616;border:1px solid #222;border-radius:10px;padding:12px 14px}
.stl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#444;margin-bottom:4px}
.stv{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:300}
.sts{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#555;margin-top:2px}
.row{padding:10px 14px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center}
.row:last-child{border-bottom:none}
.rl{flex:1;min-width:0}.rr{text-align:right;flex-shrink:0;margin-left:10px}
.rt{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:11px;color:#555;margin-top:2px}
.rv{font-family:'IBM Plex Mono',monospace;font-size:14px}
.rv2{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:2px;color:#555}
.bdg{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;text-transform:uppercase}
.bg{background:#0d2b1a;color:#4ade80}.br{background:#2b0d0d;color:#f87171}.bx{background:#1e1e1e;color:#666}
.sig{background:#161616;border:1px solid #222;border-radius:10px;margin-bottom:8px;overflow:hidden}
.se{border-left:3px solid #4ade80}.sx{border-left:3px solid #f87171}.sh{border-left:3px solid #333}
.shd{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.stk{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500}
.sbar{height:3px;background:#1e1e1e;margin:0 14px 8px}
.sfl{height:100%;border-radius:2px}
.sdt{padding:0 14px 10px;font-size:12px;color:#666;line-height:1.55}
.sst{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 14px;border-top:1px solid #1a1a1a;display:flex;gap:14px}
.sst span{color:#444}.sst b{color:#ddd;font-weight:500}
.mt{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid #111}
.mt:last-child{border-bottom:none}
.mtk{font-family:'IBM Plex Mono',monospace;font-size:11px;width:48px;flex-shrink:0}
.mb{flex:1;height:5px;background:#1e1e1e;border-radius:3px;overflow:hidden}
.mf{height:100%;border-radius:3px}
.ms{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#444;width:24px;text-align:right;flex-shrink:0}
.mp{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#333;width:56px;text-align:right;flex-shrink:0}
.je{padding:10px 14px;border-bottom:1px solid #1a1a1a}
.je:last-child{border-bottom:none}
.jm{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.jt{font-size:13px;color:#ccc;line-height:1.5}
.jtm{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#444}
.empty{padding:20px;text-align:center;font-size:12px;color:#333}
.ball{transition:transform .15s;cursor:default;flex-shrink:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ball:hover{transform:scale(1.07)}
</style>
</head>

    </div>
  </div>
</div>

  <div class="tab on" data-t="holdings">Holdings</div>

</div>

      <canvas id="sb" style="display:block;width:100%"></canvas>
      <div id="sb-key" style="padding:8px 14px;display:flex;flex-wrap:wrap;gap:5px;border-top:1px solid #1a1a1a"></div>
    </div>
    <div class="sl">Cumulative Holdings</div><div class="card" id="cum-list"></div>
  </div>
  <div id="t-signals" class="sec">
    <div class="sl" id="sig-tf"></div>
    <div class="sl">Entries</div><div id="entries"></div>
    <div class="sl" style="margin-top:18px">Exits</div><div id="exits"></div>
  </div>
  <div id="t-watchlist" class="sec">
    <div class="sl">EMA scores</div>
    <div class="card" id="wl-list"></div>
    <div class="sl">Chart</div>
    <div class="card"><div style="padding:14px;position:relative;height:200px"><canvas id="sc"></canvas></div></div>
  </div>
  <div id="t-journal" class="sec">
    <div class="sg" id="j-sg"></div>
    <div id="goal-box"></div>
    <div class="sl">Today</div><div class="card" id="j-list"></div>
    <div class="sl" style="margin-top:16px">Trade Scores</div>
    <div class="card" id="j-trades"></div>
  </div>
  <div id="t-trades" class="sec">
    <div class="card" id="t-list"></div>
  </div>
</div>

// TRADES — bubble view
(function(){
  var trades  = DATA.trades   || [];
  var posList = DATA.positions|| [];
  if(!trades.length){
    $('t-list').innerHTML='<div style="padding:24px;text-align:center;color:#555;font-size:13px">No trades logged yet</div>';
    return;
  }
  var curPx={};
  posList.forEach(function(p){ if(!curPx[p.symbol]) curPx[p.symbol]=p.price; });
  var openT  = trades.filter(function(t){return t.status==='OPEN';});
  var closedT= trades.filter(function(t){return t.status==='CLOSED';});
  var openPL=0;
  openT.forEach(function(t){if(t.direction==='BUY'){var cur=curPx[t.symbol]||t.price;openPL+=(cur-t.price)*t.shares;}});
  var closedPL=closedT.reduce(function(s,t){return s+(t.pl||0);},0);
  var totalPL=openPL+closedPL;
  var wins=closedT.filter(function(t){return (t.pl||0)>0;}).length;
  var losses=closedT.filter(function(t){return (t.pl||0)<0;}).length;
  var wr=wins+losses>0?Math.round(wins/(wins+losses)*100):null;

  function fv(n){var a=Math.abs(n);if(a>=1000000)return (n<0?'-':'')+'$'+(a/1000000).toFixed(1)+'M';if(a>=1000)return (n<0?'-':'')+'$'+(a/1000).toFixed(0)+'K';return (n<0?'-':'')+'$'+Math.round(a);}
  function fp2(n){return (n>=0?'+':'')+fv(n);}

  function tradeGrade(pct){return pct>=5?'A':pct>=2?'B':pct>=0?'C':pct>=-2?'D':'F';}

  function bubCash(acct,amount,maxV){

      ctx2.beginPath();ctx2.arc(r,r,r-0.5,0,Math.PI*2);ctx2.fillStyle=g1;ctx2.fill();
      var gS=ctx2.createRadialGradient(r*0.4,r*0.28,0,r*0.46,r*0.36,r*0.27);
      gS.addColorStop(0,"rgba(255,255,255,.85)");gS.addColorStop(0.38,"rgba(255,255,255,.28)");
      gS.addColorStop(1,"rgba(255,255,255,0)");

      (effGrade?'<span style="font-size:'+Math.max(11,Math.min(16,sz*.16))+'px;font-weight:900;letter-spacing:.04em;color:'+(effGrade==='A'||effGrade==='B'?'#4ade80':effGrade==='C'?'#fbbf24':'#f87171')+';opacity:'+(gradeProsp?.55:1)+';line-height:1.1;text-shadow:0 1px 4px rgba(0,0,0,.6)">'+(gradeProsp?'~':'')+effGrade+'</span>':'')+
      '</div></div>';

    setTimeout(function(){
      var el=document.getElementById(id);
      if(!el) return;
      var cv=el.querySelector("canvas");
      if(!cv) return;
      var ctx2=cv.getContext("2d");
      var r=sz/2;
      var isP=pl>=0;
      var c1=isP?"#052e16":"#450a0a";
      var c2=isP?"#166534":"#991b1b";
      var c3=isP?"#16a34a":"#dc2626";
      var c4=isP?"#4ade80":"#f87171";
      var c5=isP?"#bbf7d0":"#fecaca";
      if(dashed){c1=isP?"#0f2d1a":"#2a0f0f";c3=isP?"#166534":"#b91c1c";c4=isP?"#22c55e":"#ef4444";}

      var g1=ctx2.createRadialGradient(r*0.42,r*0.36,r*0.04,r,r,r*1.04);
      g1.addColorStop(0,c5);g1.addColorStop(0.18,c4);g1.addColorStop(0.44,c3);
      g1.addColorStop(0.72,c2);g1.addColorStop(1,c1);
      ctx2.beginPath();ctx2.arc(r,r,r-0.5,0,Math.PI*2);ctx2.fillStyle=g1;ctx2.fill();

      var g2=ctx2.createRadialGradient(r*1.28,r*1.32,r*0.08,r*1.1,r*1.12,r*0.88);
      g2.addColorStop(0,"rgba(0,0,0,.52)");g2.addColorStop(1,"rgba(0,0,0,0)");
      ctx2.beginPath();ctx2.arc(r,r,r-0.5,0,Math.PI*2);ctx2.fillStyle=g2;ctx2.fill();

      var gS=ctx2.createRadialGradient(r*0.4,r*0.28,0,r*0.46,r*0.36,r*0.27);
      gS.addColorStop(0,"rgba(255,255,255,.9)");gS.addColorStop(0.38,"rgba(255,255,255,.32)");
      gS.addColorStop(1,"rgba(255,255,255,0)");
      ctx2.beginPath();ctx2.arc(r,r,r-0.5,0,Math.PI*2);ctx2.fillStyle=gS;ctx2.fill();

      var gG=ctx2.createRadialGradient(r,r*0.16,0,r,r*0.24,r*0.44);
      gG.addColorStop(0,"rgba(255,255,255,.16)");gG.addColorStop(1,"rgba(255,255,255,0)");
      ctx2.beginPath();ctx2.arc(r,r,r-0.5,0,Math.PI*2);ctx2.fillStyle=gG;ctx2.fill();

      if(dashed){
        ctx2.save();ctx2.beginPath();ctx2.arc(r,r,r-3,0,Math.PI*2);
        ctx2.strokeStyle="rgba(255,255,255,.4)";ctx2.lineWidth=2;ctx2.setLineDash([5,4]);
        ctx2.stroke();ctx2.restore();
      }
      el.style.filter="drop-shadow(0 8px 20px rgba(0,0,0,.6)) drop-shadow(0 2px 4px rgba(0,0,0,.4))";
    },0);
    return html;
  }

  function secHdr(label,col){return '<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:'+(col||'#4ade80')+';margin:16px 14px 8px">'+label+'</div>';}
  function grid(inner){return '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:center;padding:0 14px;min-height:40px">'+inner+'</div>';}

  // Section 1 — every individual trade
  var v1=trades.map(function(t){return t.total||0;});
  var m1=Math.max.apply(null,v1.concat([1]));
  // Section 1: include cash as grey balls
  var cashBalls=[];
  (DATA.accounts||[]).forEach(function(a){
    if(a.cash>0) cashBalls.push({symbol:'CASH',account:a.name,cash:a.cash});
  });
  var ts1=trades.map(function(t){
    var isBuy=t.direction==='BUY';
    var cur=curPx[t.symbol]||t.price;
    var pl=t.status==='CLOSED'?(t.pl||0):(isBuy?(cur-t.price)*t.shares:0);
    var plPct=t.price>0?(pl/(t.shares*t.price)*100):0;
    return {t:t,cur:cur,pl:pl,plPct:plPct};
  }).sort(function(a,b){return b.pl-a.pl;});
  var maxPL1=Math.max.apply(null,ts1.map(function(x){return Math.abs(x.pl);}).concat([1]));
  // Merge cash into section 1, treating cash amount as pl for sort+size
  var allS1=ts1.map(function(x){return {pl:x.pl,html:bub(x.t.symbol,sa(x.t.account),x.t.price.toFixed(2),x.cur.toFixed(2),x.pl,x.plPct,Math.abs(x.pl),1,x.t.status==='CLOSED'),isCash:false};});
  cashBalls.forEach(function(c){ allS1.push({pl:c.cash,html:null,isCash:true,cash:c.cash,acct:c.account}); });
  allS1.sort(function(a,b){return Math.abs(b.pl)-Math.abs(a.pl);});
  var maxS1=Math.max.apply(null,allS1.map(function(x){return Math.abs(x.pl);}).concat([1]));
  var s1=allS1.map(function(x){
    if(x.isCash) return bubCash(sa(x.acct),x.cash,maxS1);
    var t=x; var xo=ts1.filter(function(y){return y.pl===x.pl;})[0];
    if(!xo) return '';
    return bub(xo.t.symbol,sa(xo.t.account),xo.t.price.toFixed(2),xo.cur.toFixed(2),xo.pl,xo.plPct,Math.abs(xo.pl),maxS1,xo.t.status==='CLOSED',false,null,xo.t.grade||"");
  }).join('');

  // Section 2 — by symbol + account
  var g2={};
  trades.forEach(function(t){
    var k=t.symbol+'|'+t.account;
    if(!g2[k]) g2[k]={sym:t.symbol,acct:t.account,shares:0,cost:0,pl:0,open:false};
    if(t.direction==='BUY'){g2[k].shares+=t.shares;g2[k].cost+=t.shares*t.price;}
    if(t.pl) g2[k].pl+=t.pl;
    if(t.status==='OPEN') g2[k].open=true;
  });
  var a2=[];
  for(var k2 in g2){
    var gg=g2[k2];
    gg.avg=gg.shares>0?gg.cost/gg.shares:0;
    var cur2=curPx[gg.sym]||gg.avg;
    if(gg.open) gg.pl=(cur2-gg.avg)*gg.shares;
    gg.total=gg.shares*(gg.open?cur2:gg.avg)||Math.abs(gg.pl);
    a2.push(gg);
  }
  var m2=Math.max.apply(null,a2.map(function(g){return g.total;}).concat([1]));
  a2.sort(function(a,b){return b.pl-a.pl;});
  var maxPL2=Math.max.apply(null,a2.map(function(g){return Math.abs(g.pl);}).concat([1]));
  // Group a2 by account for section 2
  var acctGroups={};
  a2.forEach(function(g){
    var k=g.acct;
    if(!acctGroups[k]) acctGroups[k]=[];
    acctGroups[k].push(g);
  });
  var s2='<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;align-items:start;justify-items:center;">';
  var AM=DATA.account_meta||{};
  var maxCash=Math.max.apply(null,(DATA.accounts||[]).map(function(a){return a.cash>0?a.cash:0;}).concat([1]));
  // Account size = true total (cash+stock) when the bridge is present, else total position value held
  function acctSize(name){
    var posVal=acctGroups[name].reduce(function(s,g){return s+(g.total||0);},0);
    return (AM[name]&&AM[name].total!=null)?AM[name].total:posVal;
  }
  var orderedAccts=Object.keys(acctGroups).sort(function(x,y){return acctSize(y)-acctSize(x);});
  orderedAccts.forEach(function(acctName){
    var grp=acctGroups[acctName];
    grp.sort(function(a,b){return Math.abs(b.pl)-Math.abs(a.pl);});
    var grpMax=Math.max.apply(null,grp.map(function(g){return Math.abs(g.pl);}).concat([1]));
    var fullName=(AM[acctName]&&AM[acctName].name)?AM[acctName].name:acctName;
    var shortName=sa(fullName);
    var acctCash=(AM[acctName]&&AM[acctName].cash!=null)?AM[acctName].cash:0;
    s2+='<div style="display:flex;flex-direction:column;align-items:center;gap:5px;">';
    s2+='<div style="text-align:center;max-width:160px">'+
        '<div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+shortName+'</div>'+
        '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:#4ade80;margin-top:1px">'+fv(acctSize(acctName))+'</div>'+
        '</div>';
    s2+='<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:center;">';
    if(acctCash>0) s2+=bubCash('',acctCash,maxCash);
    grp.forEach(function(g){
      var cx=curPx[g.sym]||g.avg;
      var pp=g.avg>0?g.pl/(g.shares*g.avg)*100:0;
      s2+=bub(g.sym,shortName,g.avg.toFixed(2),cx.toFixed(2),g.pl,pp,Math.abs(g.pl),grpMax,!g.open,true,g.cost);
    });
    s2+='</div></div>';
  });
  s2+='</div>';

  // Section 3 — by symbol across all accounts
  var g3={};
  trades.forEach(function(t){
    if(!g3[t.symbol]) g3[t.symbol]={sym:t.symbol,shares:0,cost:0,pl:0,open:false,naccts:0,acctSeen:{}};
    var gg=g3[t.symbol];
    if(!gg.acctSeen[t.account]){gg.acctSeen[t.account]=1;gg.naccts++;}
    if(t.direction==='BUY'){gg.shares+=t.shares;gg.cost+=t.shares*t.price;}
    if(t.pl) gg.pl+=t.pl;
    if(t.status==='OPEN') gg.open=true;
  });
  var a3=[];
  for(var k3 in g3){
    var ggg=g3[k3];
    ggg.avg=ggg.shares>0?ggg.cost/ggg.shares:0;
    var cur3=curPx[k3]||ggg.avg;
    if(ggg.open) ggg.pl=(cur3-ggg.avg)*ggg.shares;
    ggg.total=ggg.shares*(ggg.open?cur3:ggg.avg)||Math.abs(ggg.pl);
    a3.push(ggg);
  }
  var m3=Math.max.apply(null,a3.map(function(g){return g.total;}).concat([1]));
  a3.sort(function(a,b){return b.pl-a.pl;});
  // Build all-S3 including cash
  var allS3=a3.map(function(g){return {pl:g.pl,isCash:false,g:g};});
  // Merge ALL account cash into a single combined cash ball (stocks stay separate per symbol)
  var totalCash=(DATA.accounts||[]).reduce(function(s,a){return s+(a.cash>0?a.cash:0);},0);
  if(totalCash>0) allS3.push({pl:totalCash,isCash:true,cash:totalCash,acct:'All accounts'});
  allS3.sort(function(a,b){return Math.abs(b.pl)-Math.abs(a.pl);});
  var maxPL3=Math.max.apply(null,allS3.map(function(x){return Math.abs(x.pl);}).concat([1]));
  var s3=allS3.map(function(x){
    if(x.isCash) return bubCash(sa(x.acct),x.cash,maxPL3);
    var g=x.g;
    var cx=curPx[g.sym]||g.avg;
    var pp=g.avg>0?g.pl/(g.shares*g.avg)*100:0;
    var acctLbl=g.naccts===1?sa(Object.keys(g.acctSeen)[0]):g.naccts+' accts';
    return bub(g.sym,acctLbl,g.avg.toFixed(2),cx.toFixed(2),g.pl,pp,Math.abs(g.pl),maxPL3,!g.open,false,g.cost);
  }).join('');

  // Stats
  var stats=
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#1a1a1a">'+
    '<div style="background:#161616;padding:12px;text-align:center"><div style="font-size:10px;color:#444;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Trades</div>'+
    '<div style="font-family:monospace;font-size:18px;font-weight:300">'+trades.length+'</div>'+
    '<div style="font-size:11px;color:#555;margin-top:2px">'+openT.length+' open  '+closedT.length+' closed</div></div>'+
    '<div style="background:#161616;padding:12px;text-align:center"><div style="font-size:10px;color:#444;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Net P&L</div>'+
    '<div style="font-family:monospace;font-size:18px;font-weight:300;color:'+(totalPL>=0?'#4ade80':'#f87171')+'">'+(totalPL>=0?'+':'')+fv(totalPL)+'</div>'+
    '<div style="font-size:11px;color:#555;margin-top:2px">open and closed</div></div>'+
    '<div style="background:#161616;padding:12px;text-align:center"><div style="font-size:10px;color:#444;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Win rate</div>'+
    '<div style="font-family:monospace;font-size:18px;font-weight:300">'+(wr!==null?wr+'%':'--')+'</div>'+
    '<div style="font-size:11px;color:#555;margin-top:2px">'+(wr!==null?wins+' W  '+losses+' L':'--')+'</div></div>'+
    '</div>';

  var legend='<div style="display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:10px;color:#444;flex-wrap:wrap;padding:0 14px 16px">'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-right:4px"></span>Profit</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#dc2626;margin-right:4px"></span>Loss</span>'+
    '<span>Dashed border = closed</span></div>';

  $('t-list').innerHTML=stats+
    secHdr('Individual trades')+grid(s1)+
    secHdr('By stock and account','#60a5fa')+grid(s2)+
    secHdr('By stock — all accounts','#a78bfa')+grid(s3)+
    legend;
})();
</script>
</body>
</html>

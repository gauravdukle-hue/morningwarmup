<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Dashboard</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:14px}
.g{color:#4ade80}.r{color:#f87171}.m{color:#888}
.top{background:#111;border-bottom:1px solid #222;padding:14px 16px;position:sticky;top:0;z-index:10}
.brand{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#444;margin-bottom:6px}
.nw-row{display:flex;justify-content:space-between;align-items:flex-end}
.nw{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:300}
.nw-pl{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:3px}
.ts{font-size:10px;color:#444}
.tabs{display:flex;background:#111;border-bottom:1px solid #222;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 16px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#555;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.tab.on{color:#fff;border-bottom-color:#4ade80}
.pg{padding:14px 14px 60px}
.sec{display:none}.sec.on{display:block}
.card{background:#161616;border:1px solid #222;border-radius:10px;margin-bottom:12px;overflow:hidden}
.ch{padding:11px 14px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.cl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#444}
.sl{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#555;margin:16px 0 8px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:#161616;border:1px solid #222;border-radius:10px;padding:12px 14px}
.stl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#444;margin-bottom:4px}
.stv{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:300}
.sts{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#555;margin-top:2px}
.row{padding:10px 14px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center}
.row:last-child{border-bottom:none}
.rl{flex:1;min-width:0}.rr{text-align:right;flex-shrink:0;margin-left:10px}
.rt{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:11px;color:#555;margin-top:2px}
.rv{font-family:'IBM Plex Mono',monospace;font-size:14px}
.rv2{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:2px;color:#555}
.bdg{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;text-transform:uppercase}
.bg{background:#0d2b1a;color:#4ade80}.br{background:#2b0d0d;color:#f87171}.bx{background:#1e1e1e;color:#666}
.sig{background:#161616;border:1px solid #222;border-radius:10px;margin-bottom:8px;overflow:hidden}
.se{border-left:3px solid #4ade80}.sx{border-left:3px solid #f87171}.sh{border-left:3px solid #333}
.shd{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.stk{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500}
.sbar{height:3px;background:#1e1e1e;margin:0 14px 8px}
.sfl{height:100%;border-radius:2px}
.sdt{padding:0 14px 10px;font-size:12px;color:#666;line-height:1.55}
.sst{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 14px;border-top:1px solid #1a1a1a;display:flex;gap:14px}
.sst span{color:#444}.sst b{color:#ddd;font-weight:500}
.mt{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid #111}
.mt:last-child{border-bottom:none}
.mtk{font-family:'IBM Plex Mono',monospace;font-size:11px;width:48px;flex-shrink:0}
.mb{flex:1;height:5px;background:#1e1e1e;border-radius:3px;overflow:hidden}
.mf{height:100%;border-radius:3px}
.ms{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#444;width:24px;text-align:right;flex-shrink:0}
.mp{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#333;width:56px;text-align:right;flex-shrink:0}
.je{padding:10px 14px;border-bottom:1px solid #1a1a1a}
.je:last-child{border-bottom:none}
.jm{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.jt{font-size:13px;color:#ccc;line-height:1.5}
.jtm{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#444}
.empty{padding:20px;text-align:center;font-size:12px;color:#333}

var $ = function(id){ return document.getElementById(id); };
var fm = function(n){ return '$'+Math.abs(Math.round(n)).toLocaleString(); };
var fd = function(n){ return (n>=0?'+':'-')+fm(n); };
var fp = function(n){ return (n>=0?'+':'')+n.toFixed(1)+'%'; };
var pc = function(n){ return n>=0?'g':'r'; };

document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){

    t.classList.add('on');
    document.getElementById('t-'+t.dataset.t).classList.add('on');
  };
});

// SUNBURST
(function(){
  var accts = DATA.accounts.filter(function(a){return a.total>0;}).sort(function(a,b){return b.total-a.total;});
  var tot   = accts.reduce(function(s,a){return s+a.total;},0);
  var cash  = accts.reduce(function(s,a){return s+a.cash;},0);
  var inv   = accts.reduce(function(s,a){return s+a.stock_total;},0);
  var tpl   = accts.reduce(function(s,a){return s+(a.stock_total-a.stock_cost);},0);
  $('h-sg').innerHTML =
    '<div class="st"><div class="stl">Invested</div><div class="stv">'+fm(inv)+'</div><div class="sts '+pc(tpl)+'">'+fd(tpl)+' P&L</div></div>'+
    '<div class="st"><div class="stl">Cash</div><div class="stv">'+fm(cash)+'</div><div class="sts m">'+accts.length+' accounts</div></div>';
  $('sb-tot').textContent = fm(tot);
  var COLS=['#60a5fa','#4ade80','#fbbf24','#f87171','#a78bfa','#fb923c','#34d399','#e879f9','#38bdf8','#818cf8'];
  var pba={};
  DATA.positions.forEach(function(p){if(!pba[p.account])pba[p.account]=[];pba[p.account].push(p);});
  var canvas=$('sb'),W=canvas.parentElement.clientWidth||360,H=W*0.25;
  canvas.width=W;canvas.height=H;canvas.style.height=H+'px';
  var ctx=canvas.getContext('2d');
  var cx=W/2,cy=H/2;
  var hole=H*0.12,r1=H*0.24,r2=H*0.35,r3=H*0.44;
  var pad=0.012;
  function hex2rgb(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')';}
  function drawSlice(ri,ro,sa,ea,fill){if(ea-sa<pad*2)return;var s=sa+pad/2,e=ea-pad/2;ctx.beginPath();ctx.arc(cx,cy,ro,s,e);ctx.arc(cx,cy,ri,e,s,true);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
  function drawLabel(ri,ro,sa,ea,l1,l2,col){var span=ea-sa;if(span<0.08)return;var mid=sa+span/2,r=(ri+ro)/2,lx=cx+r*Math.cos(mid),ly=cy+r*Math.sin(mid),fs=Math.max(7,Math.min(12,span*(ri+ro)*0.09));ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';if(l2&&span>0.14){ctx.font='600 '+fs+'px sans-serif';ctx.fillText(l1,lx,ly-fs*0.65);ctx.font='400 '+(fs-1)+'px monospace';ctx.fillStyle='#ccc';ctx.fillText(l2,lx,ly+fs*0.65);}else{ctx.font='600 '+fs+'px sans-serif';ctx.fillText(l1,lx,ly);}ctx.restore();}
  ctx.fillStyle='#161616';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.font='300 12px monospace';ctx.fillText(fm(tot),cx,cy-10);
  ctx.fillStyle=tpl>=0?'#4ade80':'#f87171';ctx.font='400 8px monospace';ctx.fillText(fd(tpl),cx,cy+4);
  ctx.fillStyle='#444';ctx.font='400 7px sans-serif';ctx.fillText('NET WORTH',cx,cy+15);
  var TWO_PI=2*Math.PI,startAngle=-Math.PI/2;
  accts.forEach(function(a,i){
    var col=COLS[i%COLS.length],acctAngle=TWO_PI*(a.total/tot),endAngle=startAngle+acctAngle;
    var sn=a.name.replace('G Fidelity ','G ').replace('R Fidelity ','R ').replace('Intel ','').replace('Etrade','ET').replace('Robinhood','RH').trim();
    drawSlice(hole,r1,startAngle,endAngle,col);
    drawLabel(hole,r1,startAngle,endAngle,sn,fm(a.total),null);
    var pos=(pba[a.name]||[]).map(function(p){return{sym:p.symbol,mv:Math.round(p.shares*p.price),pl:Math.round((p.price-p.avg)*p.shares)};}).sort(function(x,y){return y.mv-x.mv;});
    var holdings=[];
    if(a.cash>0)holdings.push({lbl:'Cash',val:a.cash,isCash:true,pl:0});
    pos.forEach(function(p){holdings.push({lbl:p.sym,val:p.mv,isCash:false,pl:p.pl});});
    holdings.sort(function(x,y){return y.val-x.val;});
    if(holdings.length){var hsum=holdings.reduce(function(s,h){return s+h.val;},0);holdings[0].val+=(a.total-hsum);}
    var hStart=startAngle;
    holdings.forEach(function(h){
      var hAngle=acctAngle*(h.val/a.total),hEnd=hStart+hAngle;
      if(!h.isCash){drawSlice(r1,r2,hStart,hEnd,hex2rgb(col,0.5));drawLabel(r1,r2,hStart,hEnd,h.lbl,fm(h.val),null);var plCol=h.pl>=0?'rgba(74,222,128,0.85)':'rgba(248,113,113,0.85)';drawSlice(r2,r3,hStart,hEnd,plCol);drawLabel(r2,r3,hStart,hEnd,(h.pl>=0?'+':'-')+fm(Math.abs(h.pl)),'',null);}
      else{drawSlice(r1,r2,hStart,hEnd,'rgba(20,20,20,0.6)');drawLabel(r1,r2,hStart,hEnd,'Cash',fm(h.val),'#666');drawSlice(r2,r3,hStart,hEnd,'rgba(10,10,10,0.4)');}
      hStart=hEnd;
    });
    startAngle=endAngle;
  });
  $('sb-key').innerHTML=accts.map(function(a,i){var c=COLS[i%COLS.length],sn=a.name.replace('G Fidelity ','G ').replace('R Fidelity ','R ').replace('Intel ','').replace('Etrade','ET').replace('Robinhood','RH').trim();return '<span style="font-size:9px;padding:2px 7px;border-radius:3px;background:'+c+'22;color:'+c+';font-weight:600">'+sn+'</span>';}).join('')+'<span style="font-size:9px;padding:2px 7px;border-radius:3px;background:#4ade8022;color:#4ade80;font-weight:600">Profit</span><span style="font-size:9px;padding:2px 7px;border-radius:3px;background:#f8717122;color:#f87171;font-weight:600">Loss</span>';

  // Cumulative holdings
  var cumMap={};
  DATA.positions.forEach(function(p){if(!cumMap[p.symbol])cumMap[p.symbol]={shares:0,cost:0,mv:0};cumMap[p.symbol].shares+=p.shares;cumMap[p.symbol].cost+=p.shares*p.avg;cumMap[p.symbol].mv+=p.shares*p.price;});
  var cumList=Object.keys(cumMap).map(function(sym){var c=cumMap[sym],avgPrice=c.cost/c.shares,pl=c.mv-c.cost;return{sym:sym,shares:c.shares,avg:avgPrice,invested:c.cost,mv:c.mv,pl:pl};}).sort(function(a,b){return b.mv-a.mv;});
  $('cum-list').innerHTML=cumList.length?cumList.map(function(c){var plPct=c.pl/c.cost*100;return '<div class="row"><div class="rl"><div class="rt" style="font-weight:600">'+c.sym+'</div><div class="rs">'+c.shares.toLocaleString()+' sh &middot; avg $'+c.avg.toFixed(2)+'</div></div><div style="font-family:monospace;font-size:11px;text-align:right;width:70px">$'+c.avg.toFixed(2)+'</div><div style="font-family:monospace;font-size:11px;text-align:right;width:80px">'+fm(c.invested)+'</div><div style="font-family:monospace;font-size:12px;text-align:right;width:80px;color:'+(c.pl>=0?'#4ade80':'#f87171')+'">'+(c.pl>=0?'+':'-')+fm(c.pl)+'<br><span style="font-size:10px">'+(plPct>=0?'+':'')+plPct.toFixed(1)+'%</span></div></div>';}).join(''):'<div class="empty">No positions</div>';
})();

// SIGNALS
(function(){
  $('sig-tf').textContent='Timeframe: '+DATA.signals.tf;
  function rend(items,el){if(!items.length){$(el).innerHTML='<div class="card"><div class="empty">No signals</div></div>';return;}$(el).innerHTML=items.map(function(s){var isE=s.type==='ENTRY'||s.type==='REENTRY';var isX=s.type==='TIER2_EXIT'||s.type==='TIER1_EXIT';var cls=isE?'se':isX?'sx':'sh';var lbl=isE?(s.type==='REENTRY'?'Re-entry':'Entry'):isX?'Exit':'Caution';var bc=isE?'bg':isX?'br':'bx';var fc=s.score>=70?'#4ade80':s.score>=60?'#fbbf24':'#f87171';var st=(s.stop&&s.target)?'<div class="sst"><span>Stop</span> <b>$'+s.stop+'</b> <span>Target</span> <b>$'+s.target+'</b></div>':'';return '<div class="sig '+cls+'"><div class="shd"><span><span class="stk">'+s.ticker+'</span> &nbsp;<span class="bdg '+bc+'">'+lbl+'</span></span><span style="font-family:monospace;font-size:11px;color:#555">'+s.score+'</span></div><div class="sbar"><div class="sfl" style="width:'+s.score+'%;background:'+fc+'"></div></div><div class="sdt">'+s.detail+'</div>'+st+'</div>';}).join('');}
  rend(DATA.signals.entries,'entries');
  rend(DATA.signals.exits,'exits');
})();

// WATCHLIST
(function(){
  var items=DATA.signals.scored;
  if(!items.length){$('wl-list').innerHTML='<div class="empty">Run /ema to populate</div>';return;}
  $('wl-list').innerHTML=items.map(function(r){var c=r.score>=70?'#4ade80':r.score>=60?'#fbbf24':'#f87171';return '<div class="mt"><div class="mtk">'+r.ticker+'</div><div class="mb"><div class="mf" style="width:'+r.score+'%;background:'+c+'"></div></div><div class="ms">'+r.score+'</div><div class="mp">$'+Number(r.price).toFixed(0)+'</div></div>';}).join('');
  new Chart($('sc'),{type:'bar',data:{labels:items.map(function(r){return r.ticker;}),datasets:[{data:items.map(function(r){return r.score;}),backgroundColor:items.map(function(r){return r.score>=70?'#4ade80':r.score>=60?'#fbbf24':'#f87171';}),borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#555',font:{size:10}},grid:{display:false}},y:{min:0,max:100,ticks:{color:'#555',font:{size:10}},grid:{color:'#1a1a1a'}}}}});
})();

// JOURNAL
(function(){
  var s=DATA.journal.stats;
  $('j-sg').innerHTML='<div class="st"><div class="stl">Sleep &middot; Mind &middot; Body</div><div class="stv">'+(s.sleep||'?')+' &middot; '+(s.mind||'?')+' &middot; '+(s.physical||'?')+'</div><div class="sts m">out of 10</div></div><div class="st"><div class="stl">P&L Today</div><div class="stv '+(s.pnl&&s.pnl[0]==='-'?'r':'g')+'">'+(s.pnl||'-')+'</div></div>';
  if(s.goal)$('goal-box').innerHTML='<div class="card" style="margin-bottom:12px"><div style="padding:12px 14px"><span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#444;font-weight:600">Goal &nbsp;</span><span style="font-size:13px;color:#ccc">'+s.goal+'</span></div></div>';
  $('j-list').innerHTML=DATA.journal.today.length?DATA.journal.today.map(function(e){var sc=e.sentiment==='positive'?'bg':e.sentiment==='negative'?'br':'bx';return '<div class="je"><div class="jm"><span class="jtm">'+e.time+'</span>'+(e.sentiment?'<span class="bdg '+sc+'">'+e.sentiment+'</span>':'')+' </div><div class="jt">'+e.entry+'</div></div>';}).join(''):'<div class="empty">No entries today</div>';
})();

// TRADES — bubble view
(function(){
  var trades  = DATA.trades   || [];
  var posList = DATA.positions|| [];
  if(!trades.length){
    $('t-list').innerHTML='<div style="padding:24px;text-align:center;color:#555;font-size:13px">No trades logged yet</div>';
    return;
  }
  var curPx={};
  posList.forEach(function(p){ if(!curPx[p.symbol]) curPx[p.symbol]=p.price; });
  var openT  = trades.filter(function(t){return t.status==='OPEN';});
  var closedT= trades.filter(function(t){return t.status==='CLOSED';});
  var openPL=0;
  openT.forEach(function(t){if(t.direction==='BUY'){var cur=curPx[t.symbol]||t.price;openPL+=(cur-t.price)*t.shares;}});
  var closedPL=closedT.reduce(function(s,t){return s+(t.pl||0);},0);
  var totalPL=openPL+closedPL;
  var wins=closedT.filter(function(t){return (t.pl||0)>0;}).length;
  var losses=closedT.filter(function(t){return (t.pl||0)<0;}).length;
  var wr=wins+losses>0?Math.round(wins/(wins+losses)*100):null;

  function fv(n){var a=Math.abs(n);if(a>=1000000)return (n<0?'-':'')+'$'+(a/1000000).toFixed(1)+'M';if(a>=1000)return (n<0?'-':'')+'$'+(a/1000).toFixed(0)+'K';return (n<0?'-':'')+'$'+Math.round(a);}
  function fp2(n){return (n>=0?'+':'')+fv(n);}
  function sa(a){return a.replace('G Fidelity ','G ').replace('R Fidelity ','R ').replace('Intel ','').replace('Etrade','ET').replace('Robinhood','RH').trim();}

  function bub(sym,acct,avgPx,curPx,pl,plPct,val,maxV,dashed){
    var minR=52,maxR=110;
    var sz=maxV>0?minR+(maxR-minR)*Math.sqrt(Math.max(0,val)/maxV):minR;
    sz=Math.max(minR,Math.min(maxR,sz));
    var bg=pl>0?'#15803d':pl<0?'#b91c1c':'#475569';
    var bdr=dashed?'border:2px dashed rgba(255,255,255,.4);opacity:.8;':'';
    var pad=Math.round(sz*0.1);
    var innerW=sz-pad*2;
    var fsSym=Math.max(10,Math.min(16,sz*0.16));
    var fsAcct=Math.max(9,Math.min(12,sz*0.115));
    var fsPx=Math.max(9,Math.min(11,sz*0.105));
    var fsPL=Math.max(9,Math.min(13,sz*0.13));
    var plColor=pl>=0?'#86efac':'#fca5a5';
    return '<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+bg+';'+bdr+
      'display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;">'+
      '<div style="width:'+innerW+'px;display:flex;flex-direction:column;align-items:center;gap:1px">'+
      '<span style="color:#fff;font-size:'+fsSym+'px;font-weight:600;line-height:1.2;text-align:center">'+sym+'</span>'+
      '<span style="color:rgba(255,255,255,.75);font-size:'+fsAcct+'px;line-height:1.2;text-align:center">'+acct+'</span>'+
      '<span style="color:rgba(255,255,255,.65);font-size:'+fsPx+'px;line-height:1.2;text-align:center">$'+avgPx+' &#8594; $'+curPx+'</span>'+
      '<span style="color:'+plColor+';font-size:'+fsPL+'px;font-weight:600;line-height:1.3;text-align:center">'+(pl>=0?'+':'')+fv(pl)+'</span>'+
      '<span style="color:'+plColor+';font-size:'+fsPx+'px;line-height:1.1;text-align:center;opacity:.85">'+(plPct>=0?'+':'')+plPct.toFixed(0)+'%</span>'+
      '</div></div>';
  }

  function secHdr(label,col){return '<div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:'+(col||'#4ade80')+';margin:16px 14px 8px">'+label+'</div>';}
  function grid(inner){return '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:center;padding:0 14px;min-height:40px">'+inner+'</div>';}

  // Section 1 — every individual trade
  var v1=trades.map(function(t){return t.total||0;});
  var m1=Math.max.apply(null,v1.concat([1]));
  var ts1=trades.slice().sort(function(a,b){return (b.total||0)-(a.total||0);});
  var s1=ts1.map(function(t){
    var isBuy=t.direction==='BUY';
    var cur=curPx[t.symbol]||t.price;
    var pl=t.status==='CLOSED'?(t.pl||0):(isBuy?(cur-t.price)*t.shares:0);
    var plPct=t.price>0?(pl/(t.shares*t.price)*100):0;
    return bub(t.symbol,sa(t.account),t.price.toFixed(2),cur.toFixed(2),pl,plPct,t.total||0,m1,t.status==='CLOSED');
  }).join('');

  // Section 2 — by symbol + account
  var g2={};
  trades.forEach(function(t){
    var k=t.symbol+'|'+t.account;
    if(!g2[k]) g2[k]={sym:t.symbol,acct:t.account,shares:0,cost:0,pl:0,open:false};
    if(t.direction==='BUY'){g2[k].shares+=t.shares;g2[k].cost+=t.shares*t.price;}
    if(t.pl) g2[k].pl+=t.pl;
    if(t.status==='OPEN') g2[k].open=true;
  });
  var a2=[];
  for(var k2 in g2){
    var gg=g2[k2];
    gg.avg=gg.shares>0?gg.cost/gg.shares:0;
    var cur2=curPx[gg.sym]||gg.avg;
    if(gg.open) gg.pl=(cur2-gg.avg)*gg.shares;
    gg.total=gg.shares*(gg.open?cur2:gg.avg)||Math.abs(gg.pl);
    a2.push(gg);
  }
  var m2=Math.max.apply(null,a2.map(function(g){return g.total;}).concat([1]));
  a2.sort(function(a,b){return b.total-a.total;});
  var cur2x,plPct2;
  var s2=a2.map(function(g){
    cur2x=curPx[g.sym]||g.avg;
    plPct2=g.avg>0?g.pl/(g.shares*g.avg)*100:0;
    return bub(g.sym,sa(g.acct),g.avg.toFixed(2),cur2x.toFixed(2),g.pl,plPct2,g.total,m2,!g.open);
  }).join('');

  // Section 3 — by symbol across all accounts
  var g3={};
  trades.forEach(function(t){
    if(!g3[t.symbol]) g3[t.symbol]={sym:t.symbol,shares:0,cost:0,pl:0,open:false,naccts:0,acctSeen:{}};
    var gg=g3[t.symbol];
    if(!gg.acctSeen[t.account]){gg.acctSeen[t.account]=1;gg.naccts++;}
    if(t.direction==='BUY'){gg.shares+=t.shares;gg.cost+=t.shares*t.price;}
    if(t.pl) gg.pl+=t.pl;
    if(t.status==='OPEN') gg.open=true;
  });
  var a3=[];
  for(var k3 in g3){
    var ggg=g3[k3];
    ggg.avg=ggg.shares>0?ggg.cost/ggg.shares:0;
    var cur3=curPx[k3]||ggg.avg;
    if(ggg.open) ggg.pl=(cur3-ggg.avg)*ggg.shares;
    ggg.total=ggg.shares*(ggg.open?cur3:ggg.avg)||Math.abs(ggg.pl);
    a3.push(ggg);
  }
  var m3=Math.max.apply(null,a3.map(function(g){return g.total;}).concat([1]));
  a3.sort(function(a,b){return b.total-a.total;});
  var cur3x,plPct3;
  var s3=a3.map(function(g){
    cur3x=curPx[g.sym]||g.avg;
    plPct3=g.avg>0?g.pl/(g.shares*g.avg)*100:0;
    return bub(g.sym,g.naccts+' acct'+(g.naccts>1?'s':''),g.avg.toFixed(2),cur3x.toFixed(2),g.pl,plPct3,g.total,m3,!g.open);
  }).join('');

  // Stats
  var stats=
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#1a1a1a">'+
    '<div style="background:#161616;padding:12px;text-align:center"><div style="font-size:10px;color:#444;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Trades</div>'+
    '<div style="font-family:monospace;font-size:18px;font-weight:300">'+trades.length+'</div>'+
    '<div style="font-size:11px;color:#555;margin-top:2px">'+openT.length+' open  '+closedT.length+' closed</div></div>'+
    '<div style="background:#161616;padding:12px;text-align:center"><div style="font-size:10px;color:#444;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Net P&L</div>'+
    '<div style="font-family:monospace;font-size:18px;font-weight:300;color:'+(totalPL>=0?'#4ade80':'#f87171')+'">'+(totalPL>=0?'+':'')+fv(totalPL)+'</div>'+
    '<div style="font-size:11px;color:#555;margin-top:2px">open and closed</div></div>'+
    '<div style="background:#161616;padding:12px;text-align:center"><div style="font-size:10px;color:#444;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Win rate</div>'+
    '<div style="font-family:monospace;font-size:18px;font-weight:300">'+(wr!==null?wr+'%':'--')+'</div>'+
    '<div style="font-size:11px;color:#555;margin-top:2px">'+(wr!==null?wins+' W  '+losses+' L':'--')+'</div></div>'+
    '</div>';

  var legend='<div style="display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:10px;color:#444;flex-wrap:wrap;padding:0 14px 16px">'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-right:4px"></span>Profit</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#dc2626;margin-right:4px"></span>Loss</span>'+
    '<span>Dashed border = closed</span></div>';

  $('t-list').innerHTML=stats+
    secHdr('Individual trades')+grid(s1)+
    secHdr('By stock and account','#60a5fa')+grid(s2)+
    secHdr('By stock — all accounts','#a78bfa')+grid(s3)+
    legend;
})();
</script>
</body>
</html>
